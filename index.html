<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>100 Miler Pace Chart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: full-width brand bands like the website (teal header, light grey spacer), then a centered working column with purple and black section bars, black-capped cards and a black-headed table.
   Single light look by design, matching thewomens100milerproject.com: teal #0F485A, purple #361269, mint #B5DDD4, light grey #C4D3D5, black, white. */
:root{
  --teal:#0f485a; --purple:#361269; --mint:#b5ddd4; --grey:#c4d3d5; --black:#000000; --white:#ffffff;
  --bg:#ffffff; --surface:#ffffff; --ink:#111111; --muted:#4a5a60; --line:#c4d3d5; --row:#eef3f4;
  --accent:#0f485a; --accent-ink:#ffffff; --accent-soft:#e6f2ef;
  --cut:#c62828; --cut-soft:#fdeaea; --warn:#a15c00; --ok:#1f7a48; --adj:#8a5300; --adjbg:#fff1d6;
  --display:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
  --label:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:clip}
.wrap{max-width:1080px;margin:0 auto;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.bleed{width:100vw;margin-left:calc(50% - 50vw)}
.bleed-inner{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2.2rem;color:var(--white);text-shadow:0 0 12px rgba(255,255,255,.35)}
h2{font-size:1.5rem;color:var(--ink)}
.eyebrow{font-family:var(--label);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}

/* brand header band */
.top{background:var(--teal);color:var(--white)}
.top .bleed-inner{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-block:22px}
.top .eyebrow{color:rgba(255,255,255,.8)}
.top .muted{color:rgba(255,255,255,.85)}
.greyband{background:var(--grey);height:22px;margin-bottom:4px}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.brand img{width:72px;height:72px;flex:none;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.brand .title{display:flex;flex-direction:column;gap:4px;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:2px solid var(--black);background:var(--white);color:var(--black);border-radius:8px;padding:7px 14px;font-family:var(--label);font-weight:600;font-size:.9rem}
.btn:hover{background:var(--row)}
.btn.primary{background:var(--purple);color:var(--white);border-color:var(--purple)}
.btn.primary:hover{background:#4a1d8a}
.btn.ghost{background:transparent}
.top .btn{border-color:var(--white);background:transparent;color:var(--white)}
.top .btn:hover{background:rgba(255,255,255,.12)}
.top .btn.primary{background:var(--white);color:var(--teal)}
.top .btn.primary:hover{background:var(--mint)}
.btn[disabled]{opacity:.4;cursor:default}

/* section bars */
.bar{font-family:var(--display);font-weight:700;font-size:1.5rem;text-align:center;color:var(--white);padding:10px 16px;border-radius:0}
.bar.purple{background:var(--purple)}
.bar.black{background:var(--black);font-weight:500;text-shadow:0 0 10px rgba(255,255,255,.4)}

.banner{background:var(--grey);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.banner p{margin:0;max-width:75ch}

.controls{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--black);border-radius:8px;overflow:hidden;background:var(--white)}
.seg button{border:0;background:transparent;padding:6px 14px;font-family:var(--label);font-weight:600;font-size:.85rem;color:var(--black)}
.seg button+button{border-left:2px solid var(--black)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--white)}
.seg.small{border-color:var(--white);background:transparent}
.seg.small button{padding:3px 9px;font-size:.75rem;color:var(--white)}
.seg.small button+button{border-left-color:var(--white)}
.seg.small button[aria-pressed="true"]{background:var(--white);color:var(--black)}

/* plan cards: black cap like the exercise cards */
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--grey);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px;min-width:0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card > .row:first-child{background:var(--black);color:var(--white);margin:0 -16px 4px;padding:10px 16px;min-height:50px;box-sizing:border-box}
.card > .row:first-child .eyebrow{color:var(--white);font-size:.95rem;letter-spacing:.02em;text-transform:none;font-weight:700}
.card .big{color:var(--ink);font-family:var(--display);font-size:2.3rem;font-weight:700;line-height:1}
.card .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.card.plain{padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--label);font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;align-self:flex-start}
.chip.ok{color:var(--white);background:var(--ok)}
.chip.bad{color:var(--white);background:var(--cut)}
.card p{margin:0;font-size:.9rem}

/* course strip */
.strip{padding:6px 0}
.strip svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:4px;height:14px;vertical-align:-3px;margin-right:6px}

/* table */
.tablebox{border:1px solid var(--grey);border-radius:14px;overflow-x:auto;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;vertical-align:middle;border-bottom:1px solid #dde6e8;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px}
thead th{font-family:var(--label);font-weight:500;font-size:.8rem;color:rgba(255,255,255,.8);background:var(--black)}
thead th .hl{display:block;font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--white)}
tbody tr:nth-child(even) td{background:var(--row)}
tbody tr:last-child td{border-bottom:0}
td .t{font-weight:700;font-size:1rem}
td.cutcol .t.hard{color:var(--cut)}
td.cutcol .t.est{color:var(--muted);font-weight:400}
td .day{font-size:.72rem;color:var(--muted);font-weight:700;margin-right:4px}
td.miss{box-shadow:inset 4px 0 0 var(--cut)}
tbody tr td.adj{background:var(--adjbg)}
td.adj .t{color:var(--adj)}
.adjkey{display:inline-block;width:18px;height:12px;border-radius:2px;background:#f6d48f;vertical-align:-1px;margin-right:6px}
.chip.adj{color:var(--black);background:var(--adjbg);border:1px solid var(--adj)}
.seg button[disabled]{color:#9aa7ab;cursor:not-allowed}
.stn{font-weight:700}
.stn small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}

.foot{font-size:.84rem;color:var(--muted);max-width:80ch;margin:0 auto;text-align:center}
.copyfall{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:.8rem}

/* wizard */
.wiz{border:1px solid var(--grey);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px;background:var(--surface)}
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}

// Older saved charts had exactly two goals stored as goal/mid; convert them to the plan list.
function normalize(c){
  if(!c) return c;
  if(!Array.isArray(c.plans)){
    const L=c.labels||{}; c.plans=[];
    if(c.goal!=null) c.plans.push({label:L.goal||'Goal',time:c.goal});
    if(c.mid!=null) c.plans.push({label:L.mid||'B Goal',time:c.mid});
  }
  c.labels={cut:(c.labels&&c.labels.cut)||'Cutoff'};
  delete c.goal; delete c.mid;
  return c;
}

const JSPDF_URL='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
const AUTOTABLE_URL='https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js';
function loadScript(src){return new Promise((res,rej)=>{const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('load'));document.head.appendChild(el)})}
async function ensurePdfLib(){
  if(!(window.jspdf&&window.jspdf.jsPDF)) await loadScript(JSPDF_URL);
  if(!window.jspdf.jsPDF.API.autoTable) await loadScript(AUTOTABLE_URL);
  return window.jspdf.jsPDF;
}
function buildPdf(jsPDF){
  const R=compute(chart), wide=(3+(showSeg()?1:0)+R.plans.length)>7;
  const doc=new jsPDF({orientation:wide?'landscape':'portrait',unit:'pt',format:'letter'});
  const W=doc.internal.pageSize.getWidth(), M=36;
  // header band like the site
  doc.setFillColor(15,72,90); doc.rect(0,0,W,84,'F');
  try{ doc.addImage(LOGO_SRC,'PNG',M,12,60,60); }catch(e){}
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.text("THE WOMEN'S 100 MILER PROJECT PACE CHART",M+74,30);
  doc.setFontSize(20); doc.text(chart.name||'Pace chart',M+74,52);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  const sub=dShow(R.D).toFixed(1)+' '+uLabel()+'  |  '+(R.rows.length-2)+' aid stations  |  start '+fmtClock12(chart.startTime)+
    (chart.startDate?'  |  '+new Date(chart.startDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}):'');
  doc.text(sub,M+74,68);
  doc.setFillColor(196,211,213); doc.rect(0,84,W,8,'F');
  // plan summary
  let y=112; doc.setTextColor(17,17,17);
  const perRow=wide?6:3, cw=(W-2*M)/perRow, items=R.plans.length+1;
  const at=j=>({x:M+(j%perRow)*cw, yy:y+Math.floor(j/perRow)*46});
  R.plans.forEach((p,j)=>{
    const {x,yy}=at(j); const y=yy;
    doc.setTextColor(17,17,17);
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.text(p.label.toUpperCase(),x,y);
    doc.setFontSize(16); doc.text(fmtDur(p.target),x,y+18);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    doc.text(fmtPace(paceOf(p.target,R.D))+' /'+uLabel()+' avg'+(p.pinned.size?'  |  adjusted at '+p.pinned.size:''),x,y+31);
  });
  { const {x,yy}=at(R.plans.length); const y=yy;
    doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(198,40,40); doc.text(chart.labels.cut.toUpperCase(),x,y);
    doc.setFontSize(16); doc.text(fmtDur(R.T),x,y+18);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(17,17,17);
    doc.text(R.hardCount+' posted cutoffs  |  '+R.margin+' min margin',x,y+31); }
  y += (Math.ceil(items/perRow)-1)*46;
  // table
  const seg=showSeg();
  const head=[['Aid station',uLabel()].concat(seg?['Segment']:[]).concat(chart.plans.map(p=>p.label+'\n'+fmtDur(p.time))).concat([chart.labels.cut+'\n'+fmtDur(chart.total)])];
  const body=R.rows.map((r,i)=>[r.name+(r.first?'  (start)':r.last?'  (finish)':''),dShow(r.dist).toFixed(1)].concat(seg?[r.first?'':dShow(r.seg).toFixed(1)]:[])
    .concat(R.plans.map(p=>showTimePlain(p.times[i]))).concat([showTimePlain(r.cut)]));
  const nCols=head[0].length, cutCol=nCols-1, firstPlan=cutCol-R.plans.length;
  const colStyles={0:{halign:'left',fontStyle:'bold'}}; for(let c=1;c<nCols;c++) colStyles[c]={halign:'right'};
  doc.autoTable({
    startY:y+48, head, body, theme:'plain', margin:{left:M,right:M},
    styles:{font:'helvetica',fontSize:9.5,cellPadding:{top:4.5,bottom:4.5,left:6,right:6},textColor:[17,17,17],lineColor:[221,230,232],lineWidth:{bottom:0.5}},
    headStyles:{fillColor:[0,0,0],textColor:[255,255,255],fontStyle:'bold',fontSize:9},
    alternateRowStyles:{fillColor:[238,243,244]},
    columnStyles:colStyles,
    didParseCell:(d)=>{
      if(d.section==='head'){ if(d.column.index>0) d.cell.styles.halign='right'; if(d.column.index===cutCol) d.cell.styles.textColor=[255,138,128]; return; }
      const i=d.row.index, r=R.rows[i], c=d.column.index;
      if(c>=firstPlan && c<cutCol){ d.cell.styles.fontStyle='bold';
        const p=R.plans[c-firstPlan]; if(p.pinned.has(i)){ d.cell.styles.fillColor=[255,241,214]; d.cell.styles.textColor=[138,83,0]; } }
      if(c===cutCol && !r.first){ if(r.hard){ d.cell.styles.textColor=[198,40,40]; d.cell.styles.fontStyle='bold'; } else d.cell.styles.textColor=[110,124,130]; }
      if(seg && c===2) d.cell.styles.textColor=[110,124,130];
    }
  });
  let fy=doc.lastAutoTable.finalY+16;
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,104,110);
  const note='Red cutoff times are posted by the race; grey cutoff times are estimated from the overall cutoff. Shaded plan times were moved earlier so the runner arrives at least '+R.margin+' minutes before that posted cutoff; pace between those points stays even.'+
    (chart.display==='clock'?' Times are time of day.':' Times are elapsed race time (hours:minutes).');
  const lines=doc.splitTextToSize(note,W-2*M);
  if(fy+lines.length*10>doc.internal.pageSize.getHeight()-24){ doc.addPage(); fy=48; }
  doc.text(lines,M,fy);
  return doc;
}
function pdfName(){return ((chart.name||'pace chart').replace(/[^A-Za-z0-9 ._-]+/g,'').trim().replace(/\s+/g,'-')||'pace-chart')+'-pace-chart.pdf'}
async function savePdf(){
  if(pdfBusy) return;
  pdfBusy=true; pdfMsg=''; render();
  try{
    let jsPDF;
    try{ jsPDF=await ensurePdfLib(); }catch(e){ pdfMsg='The PDF tool couldn\'t load. Check your internet connection and try again.'; return; }
    const doc=buildPdf(jsPDF), name=pdfName();
    // Inside Claude the page runs in a protected frame: a normal browser download is blocked there and replaces the
    // app with an error page, so only Claude's own save prompt is used. On a regular website (GitHub Pages,
    // Squarespace) there is no window.claude and the browser download works.
    const inClaude=!!(window.claude&&window.claude.use);
    if(!inClaude){ doc.save(name); return; }
    const noSave='This Claude view can\'t save files. Open the app on claude.ai in a web browser, or use the version on your website, to save the PDF.';
    let dl=null;
    try{ dl=await window.claude.use('downloads'); }catch(e){}
    if(!dl){ pdfMsg=noSave; return; }
    try{ await dl.save({filename:name,data:doc.output('blob')}); }
    catch(e){
      const c=e&&e.code;
      if(c==='declined') return;
      pdfMsg = c==='rate_limited' ? 'A save prompt is already open. Finish or close it, then try again.' : noSave;
    }
  } finally { pdfBusy=false; render(); }
}

function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(chart))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pad = n => String(n).padStart(2,'0');

/* ---------- time helpers ---------- */
function fmtDur(min){const m=Math.round(min);const s=m<0?'-':'';const a=Math.abs(m);return s+Math.floor(a/60)+':'+pad(a%60)}
function parseDur(str){
  str=String(str||'').trim(); if(!str) return null;
  let m=str.match(/^(\d{1,3})(?::(\d{1,2}))?$/); if(!m) return NaN;
  const mm = m[2]===undefined?0:+m[2]; if(mm>59) return NaN;
  return (+m[1])*60+mm;
}
function parseClock(str){
  str=String(str||'').trim().toLowerCase().replace(/\./g,''); if(!str) return null;
  let m=str.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?$/); if(!m) return NaN;
  let h=+m[1], mm=m[2]===undefined?0:+m[2]; const ap=m[3];
  if(mm>59) return NaN;
  if(ap){ if(h<1||h>12) return NaN; if(ap[0]==='p'&&h!==12) h+=12; if(ap[0]==='a'&&h===12) h=0; }
  else if(h>23) return NaN;
  return h*60+mm;
}
function fmtClock12(tod){tod=((Math.round(tod)%1440)+1440)%1440;const h=Math.floor(tod/60),m=tod%60;const ap=h<12?'AM':'PM';const h12=h%12===0?12:h%12;return h12+':'+pad(m)+' '+ap}
function fmtTime24(tod){return pad(Math.floor(tod/60))+':'+pad(tod%60)}
function dayLabel(dayIdx){
  if(chart.startDate){
    const d=new Date(chart.startDate+'T12:00:00'); if(!isNaN(d)){d.setDate(d.getDate()+dayIdx);return d.toLocaleDateString('en-US',{weekday:'short'})}
  }
  return 'Day '+(dayIdx+1);
}
function clockParts(elapsed){const tot=chart.startTime+Math.round(elapsed);return {day:Math.floor(tot/1440),text:fmtClock12(tot%1440)}}
function showTime(elapsed){
  if(chart.display==='clock'){const c=clockParts(elapsed);return '<span class="day">'+esc(dayLabel(c.day))+'</span>'+c.text}
  return fmtDur(elapsed);
}
function showTimePlain(elapsed){
  if(chart.display==='clock'){const c=clockParts(elapsed);return dayLabel(c.day)+' '+c.text}
  return fmtDur(elapsed);
}
function fmtPace(minPerUnit){if(!isFinite(minPerUnit))return '';let m=Math.floor(minPerUnit),s=Math.round((minPerUnit-m)*60);if(s===60){m++;s=0}return m+':'+pad(s)}
const uLabel = () => chart.unit==='km'?'km':'mi';
const dShow = mi => chart.unit==='km'?mi*KM:mi;
const paceOf = (min,mi) => chart.unit==='km'? min/(mi*KM) : min/mi;

/* ---------- calculation ---------- */
function marginOf(c){return (c.margin==null||isNaN(c.margin))?15:c.margin}
// Validation shared by setup and the chart's margin buttons. Returns '' when the margin works.
function marginIssue(m,stations,plans,total){
  if(!Number.isInteger(m)||m<0||m>120) return 'Enter the cutoff margin as whole minutes from 0 to 120.';
  const first=stations.slice(1,-1).find(s=>s.cutoff!=null);
  if(first && m>=first.cutoff) return 'A '+m+' minute margin is longer than the time to the first cutoff ('+esc(first.name)+' at '+fmtDur(first.cutoff)+'). Use less than '+first.cutoff+' minutes.';
  for(const p of plans){
    if(p.time>total-m) return 'Your '+esc(p.label)+' time ('+fmtDur(p.time)+') finishes less than '+m+' minutes before the overall cutoff. Make it '+fmtDur(total-m)+' or faster, or use a smaller margin.';
  }
  return '';
}
function compute(c){
  const st=c.stations, last=st.length-1, D=st[last].dist, T=c.total;
  const rows=st.map((s,i)=>{
    let hard=false,cut;
    if(i===0){cut=0}
    else if(i===last){cut=T;hard=true}
    else if(s.cutoff!=null){cut=s.cutoff;hard=true}
    else cut=T*s.dist/D;
    return {name:s.name,dist:s.dist,seg:i?s.dist-st[i-1].dist:0,cut,hard,first:i===0,last:i===last};
  });
  const M = marginOf(c);
  function plan(target){
    // Even pace between anchors. Start at 0 and the finish at the target are anchors; any posted cutoff the plan
    // would reach later than (cutoff - margin) becomes an anchor at exactly (cutoff - margin). Repeat until none.
    const anchors=[{i:0,d:0,t:0},{i:rows.length-1,d:D,t:target}];
    const pinned=new Set();
    const interp=()=>rows.map(r=>{
      let k=0; while(k<anchors.length-2 && anchors[k+1].d<r.dist) k++;
      const a=anchors[k],b=anchors[k+1]; return a.t+(b.t-a.t)*(r.dist-a.d)/(b.d-a.d);
    });
    let times=interp();
    for(let guard=0; guard<rows.length; guard++){
      let worst=null;
      rows.forEach((r,i)=>{ if(!r.hard||r.first||r.last||pinned.has(i))return;
        const over=times[i]-(r.cut-M); if(over>0.01&&(!worst||over>worst.over)) worst={i,over}; });
      if(!worst) break;
      pinned.add(worst.i);
      anchors.push({i:worst.i,d:rows[worst.i].dist,t:rows[worst.i].cut-M});
      anchors.sort((x,y)=>x.d-y.d);
      times=interp();
    }
    let misses=[], tight=null;
    rows.forEach((r,i)=>{ if(!r.hard||r.first)return; const b=r.cut-times[i];
      if(b<-0.5) misses.push({i,b}); else if(!tight||b<tight.b) tight={i,b}; });
    return {target,times,misses,tight,pinned};
  }
  let limit=Infinity, limitAt=null;
  rows.forEach((r,i)=>{ if(r.hard&&r.dist>0){const f=r.cut/r.dist*D; if(f<limit){limit=f;limitAt=i}} });
  return {rows,D,T,plans:c.plans.map(p=>Object.assign(plan(p.time),{label:p.label})),margin:M,limit,limitAt,hardCount:rows.filter(r=>r.hard).length};
}

/* ---------- chart view ---------- */
function marginBtns(){
  const cur=marginOf(chart), opts=[10,15,20,30];
  if(!opts.includes(cur)) opts.push(cur), opts.sort((a,b)=>a-b);
  return '<div class="seg" role="group">'+opts.map(v=>{
    const bad=marginIssue(v,chart.stations,chart.plans,chart.total);
    return '<button type="button" data-set="margin" data-val="'+v+'" aria-pressed="'+(cur===v)+'"'+(bad?' disabled title="'+esc(bad.replace(/<[^>]+>/g,''))+'"':'')+'>'+v+' min</button>';
  }).join('')+'</div>';
}
function segBtns(name,opts,cur,cls){
  return '<div class="seg '+(cls||'')+'" role="group">'+opts.map(([v,l])=>'<button type="button" data-set="'+name+'" data-val="'+v+'" aria-pressed="'+(cur===v)+'">'+esc(l)+'</button>').join('')+'</div>';
}

function planCard(p,R){
  const lbl=p.label;
  let status;
  const n=p.pinned.size;
  if(p.misses.length){
    const f=R.rows[p.misses[0].i].name;
    status='<span class="chip bad">Misses '+p.misses.length+' cutoff'+(p.misses.length>1?'s':'')+'</span>';
    status+='<p>First miss: <b>'+esc(f)+'</b>, '+fmtDur(-p.misses[0].b)+' late.</p>';
  } else {
    status='<span class="chip ok">Clears all '+R.hardCount+' hard cutoffs</span>';
    if(n) status+='<p><span class="adjkey"></span>Sped up to arrive '+R.margin+' min before the cutoff at <b>'+n+'</b> station'+(n>1?'s':'')+', then eased off after to still finish in '+fmtDur(p.target)+'.</p>';
    else status+='<p>Even pace the whole way. Closest call: <b>'+esc(R.rows[p.tight.i].name)+'</b>, '+fmtDur(p.tight.b)+' ahead of the cutoff.</p>';
  }
  const avg=fmtPace(paceOf(p.target,R.D));
  return '<div class="card"><div class="row"><span class="eyebrow">'+esc(lbl)+'</span>'+(n?'<span class="chip adj">Adjusted at '+n+'</span>':'')+'</div>'+
    '<div class="row"><span class="big num">'+fmtDur(p.target)+'</span><span class="muted num">'+avg+' /'+uLabel()+' avg</span></div>'+
    (chart.display==='clock'?'<p class="muted num">Finish '+esc(showTimePlain(p.target))+'</p>':'')+
    status+'</div>';
}

function cutCard(R){
  const lim = R.limitAt!=null && isFinite(R.limit);
  return '<div class="card cutcard"><div class="row"><span class="eyebrow">'+esc(chart.labels.cut)+'</span><span class="muted" style="font-size:.8rem">'+R.hardCount+' hard, '+(R.rows.length-1-R.hardCount)+' estimated</span></div>'+
    '<div class="row"><span class="big num" style="color:var(--cut)">'+fmtDur(R.T)+'</span><span class="muted num">'+fmtPace(paceOf(R.T,R.D))+' /'+uLabel()+' avg</span></div>'+
    (lim?'<p>Slowest <b>even</b> pace that clears every cutoff: <b class="num">'+fmtPace(paceOf(R.limit,R.D))+' /'+uLabel()+'</b>, a <b class="num">'+fmtDur(R.limit)+'</b> finish. The binding cutoff is <b>'+esc(R.rows[R.limitAt].name)+'</b>.</p>':'')+
    '</div>';
}

function strip(R){
  const W=1000,x0=14,x1=986,y=34;
  const X=d=>x0+(x1-x0)*d/R.D;
  let s='<svg viewBox="0 0 '+W+' 64" role="img" aria-label="Course map of aid stations by distance">';
  s+='<line x1="'+x0+'" y1="'+y+'" x2="'+x1+'" y2="'+y+'" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>';
  R.rows.forEach(r=>{
    const x=X(r.dist).toFixed(1);
    const col=r.hard?'var(--cut)':'var(--accent)';
    const h=r.hard?14:9;
    s+='<line x1="'+x+'" y1="'+(y-h)+'" x2="'+x+'" y2="'+(y+h)+'" stroke="'+col+'" stroke-width="'+(r.hard?3:2)+'"><title>'+esc(r.name)+', '+dShow(r.dist).toFixed(1)+' '+uLabel()+(r.hard?', cutoff '+fmtDur(r.cut):'')+'</title></line>';
  });
  s+='<text x="'+x0+'" y="62" font-size="13" fill="var(--muted)" font-family="Helvetica, Arial, sans-serif">0</text>';
  s+='<text x="'+x1+'" y="62" font-size="13" fill="var(--muted)" text-anchor="end" font-family="Helvetica, Arial, sans-serif">'+dShow(R.D).toFixed(1)+' '+uLabel()+'</text>';
  s+='<text x="'+x0+'" y="12" font-size="12" fill="var(--muted)" font-family="Helvetica, Arial, sans-serif">Start</text>';
  s+='<text x="'+x1+'" y="12" font-size="12" fill="var(--muted)" text-anchor="end" font-family="Helvetica, Arial, sans-serif">Finish</text>';
  return s+'</svg>';
}

function sub(kind,txt){return '<span class="sub '+kind+'">'+txt+'</span>'}

function planCell(p,i,R){
  const r=R.rows[i], t=p.times[i];
  const miss = !r.first && r.hard && r.cut-t<-0.5;
  const adj = p.pinned.has(i);
  return '<td class="'+(miss?'miss ':'')+(adj?'adj':'')+'"'+(adj?' title="Adjusted to arrive '+R.margin+' min before the cutoff"':'')+'><span class="t">'+showTime(t)+'</span></td>';
}

function tableTSV(){
  const R=compute(chart);
  const lines=[['Aid station',uLabel()].concat(chart.plans.map(p=>p.label+' '+fmtDur(p.time))).concat([chart.labels.cut+' '+fmtDur(chart.total),'Cutoff type']).join('\t')];
  R.rows.forEach((r,i)=>lines.push([r.name,dShow(r.dist).toFixed(1)].concat(R.plans.map(p=>showTimePlain(p.times[i]))).concat([showTimePlain(r.cut),r.first?'':r.hard?'posted':'estimated']).join('\t')));
  return lines.join('\n');
}

/* ---------- wizard ---------- */
function newDraft(from){
  const c=from?normalize(clone(from)):{name:'',unit:'mi',entryUnit:'mi',display:'elapsed',detail:'buffer',startDate:'',startTime:360,cutoffFormat:'elapsed',
    labels:{cut:'Cutoff'},plans:[{label:'Goal',time:null},{label:'B Goal',time:null}],total:null,margin:15,
    stations:[{name:'Start',dist:0,cutoff:null},{name:'',dist:null,cutoff:null},{name:'Finish',dist:null,cutoff:null}]};
  const eu=c.entryUnit||c.unit||'mi';
  const d={step:1,name:c.name,entryUnit:eu,display:c.display,detail:c.detail||'buffer',startDate:c.startDate||'',startText:fmtTime24(c.startTime),
    cutoffFormat:c.cutoffFormat||'elapsed',labels:clone(c.labels),marginText:String(marginOf(c)),
    plans:c.plans.map(p=>({label:p.label,timeText:p.time!=null?fmtDur(p.time):''})),totalText:c.total!=null?fmtDur(c.total):'',
    rows:[]};
  d.rows=c.stations.map(s=>({name:s.name,distText:s.dist==null?'':String(+(eu==='km'?s.dist*KM:s.dist).toFixed(2)),
    cutText:s.cutoff==null?'':(d.cutoffFormat==='clock'?fmtClock12(c.startTime+s.cutoff):fmtDur(s.cutoff))}));
  return d;
}

function readWizInputs(){
  const q=id=>document.getElementById(id);
  if(!wiz) return;
  if(wiz.step===1){
    const u=document.querySelector('input[name=w-unit]:checked');if(u)wiz.entryUnit=u.value;
    const f=document.querySelector('input[name=w-cf]:checked'); if(f) wiz.cutoffFormat=f.value;
    wiz.rows.forEach((r,i)=>{const n=q('w-n'+i),d=q('w-d'+i),c=q('w-c'+i);if(n)r.name=n.value;if(d)r.distText=d.value;if(c)r.cutText=c.value});
  }
  if(wiz.step===2){wiz.name=q('w-name').value;wiz.startDate=q('w-date').value;wiz.startText=q('w-start').value;const d=document.querySelector('input[name=w-disp]:checked');if(d)wiz.display=d.value}
  if(wiz.step===3){
    wiz.plans.forEach((p,i)=>{const l=q('w-pl'+i),t=q('w-pt'+i);if(l)p.label=l.value;if(t)p.timeText=t.value});
    wiz.labels.cut=q('w-lc').value||'Cutoff';
    wiz.totalText=q('w-total').value;wiz.marginText=q('w-margin').value;
  }
}

function startMin(){const v=parseClock(wiz.startText);return (v==null||isNaN(v))?NaN:v}

function buildStations(syntaxOnly){
  // returns {stations} or {err}. syntaxOnly: check clock cutoffs' format without converting (start time not known yet)
  const rows=wiz.rows, out=[]; let prevD=-1, prevCut=0;
  const sm=startMin();
  for(let i=0;i<rows.length;i++){
    const r=rows[i], name=r.name.trim()||(i===0?'Start':i===rows.length-1?'Finish':'');
    if(!name) return {err:'Aid station '+i+' needs a name.'};
    let d = i===0?0:parseFloat(r.distText);
    if(isNaN(d)) return {err:name+' needs a distance.'};
    if(d<=prevD) return {err:name+' must be farther than the station before it.'};
    prevD=d;
    let cut=null;
    if(i>0 && i<rows.length-1 && r.cutText.trim()){
      if(wiz.cutoffFormat==='clock'){
        const c=parseClock(r.cutText); if(c==null||isNaN(c)) return {err:'The cutoff for '+name+' should look like 6:00 PM or 18:00.'};
        if(syntaxOnly){cut=1; out.push({name,dist:d,cutoff:cut}); continue}
        if(isNaN(sm)) return {err:'Add a valid start time in step 2 so time-of-day cutoffs can be converted.'};
        let e=((c-sm)%1440+1440)%1440; while(e<=prevCut) e+=1440; cut=e;
      } else {
        const c=parseDur(r.cutText); if(c==null||isNaN(c)) return {err:'The cutoff for '+name+' should be hours:minutes of race time, like 14:25.'};
        if(c<=prevCut) return {err:'The cutoff for '+name+' has to be later than the cutoff before it.'};
        cut=c;
      }
      prevCut=cut;
    }
    out.push({name,dist:wiz.entryUnit==='km'?d/KM:d,cutoff:cut});
  }
  if(out.length<2) return {err:'Add at least a start and a finish.'};
  return {stations:out,lastCut:prevCut};
}

function validateStep(){
  readWizInputs();
  if(wiz.step===1){const b=buildStations(true); if(b.err) return b.err}
  if(wiz.step===2){
    if(!wiz.name.trim()) return 'Give the race a name.';
    const s=startMin(); if(isNaN(s)) return 'Enter a start time like 6:00 AM or 06:00.';
    const b=buildStations(); if(b.err) return b.err;
  }
  if(wiz.step===3){
    if(!wiz.plans.length) return 'Add at least one goal time.';
    const seenL=new Set(), seenT=new Map(), plans=[];
    for(let i=0;i<wiz.plans.length;i++){
      const lab=wiz.plans[i].label.trim();
      if(!lab) return 'Give goal '+(i+1)+' a column name.';
      if(seenL.has(lab.toLowerCase())) return 'Two goals are both named "'+lab+'". Give each one a different name.';
      seenL.add(lab.toLowerCase());
      const tm=parseDur(wiz.plans[i].timeText);
      if(tm==null||isNaN(tm)||tm<=0) return 'Enter the '+lab+' time as hours:minutes, like 28:00.';
      if(seenT.has(tm)) return lab+' and '+seenT.get(tm)+' have the same time ('+fmtDur(tm)+'). Change one of them or remove it.';
      seenT.set(tm,lab); plans.push({label:lab,time:tm});
    }
    const t=parseDur(wiz.totalText);
    if(t==null||isNaN(t)) return 'Enter the overall cutoff as hours:minutes, like 34:00.';
    for(const p of plans) if(p.time>=t) return 'The '+p.label+' time ('+fmtDur(p.time)+') has to be faster than the overall cutoff ('+fmtDur(t)+').';
    const b=buildStations(); if(b.err) return b.err;
    if(b.lastCut>=t) return 'The overall cutoff has to be later than the last aid station cutoff ('+fmtDur(b.lastCut)+').';
    const mt=wiz.marginText.trim();
    if(!/^\d+$/.test(mt)) return 'Enter the cutoff margin as whole minutes from 0 to 120.';
    const mi=marginIssue(+mt,b.stations,plans,t); if(mi) return mi.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  }
  return '';
}

function parsePaste(txt){
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows=[];
  lines.forEach(l=>{
    const p=l.includes('\t')?l.split('\t'):l.split(',');
    const cells=p.map(s=>s.trim());
    if(cells.length<2||isNaN(parseFloat(cells[1]))) return; // skip header lines
    rows.push({name:cells[0],distText:cells[1],cutText:cells[2]||''});
  });
  if(rows.length<2) return null;
  if(parseFloat(rows[0].distText)!==0) rows.unshift({name:'Start',distText:'0',cutText:''});
  const last=rows[rows.length-1]; rows[0].cutText='';
  if(last.cutText){ wiz.totalText = last.cutText; last.cutText=''; }
  return rows;
}

// Arrival window: fastest goal column to the cutoff (or the slowest goal where a station has no posted cutoff).
function dbWin(R,i){
  if(i===0) return {early:0,late:0,eLab:'',lLab:''};
  let e=Infinity,eL='',l=-Infinity,lL='';
  R.plans.forEach(p=>{const t=p.times[i]; if(t<e){e=t;eL=p.label} if(t>l){l=t;lL=p.label}});
  const r=R.rows[i]; if(r.hard){l=r.cut;lL=chart.labels.cut}
  return {early:e,late:l,eLab:eL,lLab:lL};
}

/* placeholder conditions (stage 1) */
const SAMPLE_SUNRISE=420, SAMPLE_SUNSET=1140;
function todOf(el){return ((chart.startTime+Math.round(el))%1440+1440)%1440}
function isDark(el){const t=todOf(el);return t<SAMPLE_SUNRISE||t>=SAMPLE_SUNSET}
function sampleTempF(el){const h=todOf(el)/60;return 51-13*Math.cos((h-3)/24*2*Math.PI)} // low about 38 at 3 AM, high about 64 at 3 PM
function sampleRain(el){const t=todOf(el);return (t>=1320||t<240)?45:20}
function dbWx(from,to){
  let lo=Infinity,hi=-Infinity,rain=0,darkMin=0,prev=isDark(from);const events=[],step=15;
  for(let el=from;el<=to+0.01;el+=step){
    const T=sampleTempF(el);lo=Math.min(lo,T);hi=Math.max(hi,T);rain=Math.max(rain,sampleRain(el));
    const d=isDark(el); if(d&&el<to) darkMin+=Math.min(step,to-el);
    if(d!==prev) events.push({type:d?'sunset':'sunrise',el}); prev=d;
  }
  return {lo,hi,rain,darkMin,events};
}
function fmtT(f){return chart.unit==='km'?Math.round((f-32)*5/9)+'°C':Math.round(f)+'°F'}
function clk(el){const c=clockParts(el);return dayLabel(c.day)+' '+c.text}
function evText(ev){const c=clockParts(ev.el);return (ev.type==='sunset'?'Sunset ':'Sunrise ')+dayLabel(c.day)+' '+fmtClock12(ev.type==='sunset'?SAMPLE_SUNSET:SAMPLE_SUNRISE)}
function fmtHrs(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?(h+' hr'+(m?' '+m+' min':'')):m+' min'}

function dbCtx(R,bags,k){
  const b=bags[k], w=dbWin(R,b.i), ctx={b,w};
  if(b.kind!=='finish'){
    const nx=bags[k+1], nw=dbWin(R,nx.i);
    Object.assign(ctx,{next:nx,nw,from:w.early,to:nw.late,nextName:nx.kind==='finish'?'the finish':nx.name});
    // Time for this stretch in each column. Suggestions use the slowest one.
    ctx.legs=R.plans.map(p=>({label:p.label,mins:p.times[nx.i]-p.times[b.i]}));
    ctx.legs.push({label:chart.labels.cut,mins:R.rows[nx.i].cut-R.rows[b.i].cut,cut:true});
    ctx.slow=ctx.legs.reduce((a,c)=>c.mins>=a.mins?c:a);
    ctx.mins=ctx.slow.mins; ctx.hours=ctx.mins/60; ctx.wx=dbWx(ctx.from,ctx.to);
    ctx.miNext=R.rows[nx.i].dist-R.rows[b.i].dist;
    const na=R.rows[b.i+1]; ctx.aidName=na.last?'the finish':na.name; ctx.miAid=na.dist-R.rows[b.i].dist;
  }
  return ctx;
}
function dbSuggest(b,ctx){
  const out=[], add=(id,qty,why)=>{ if(!out.some(o=>o.id===id)) out.push({id,name:DB_BYID[id].name,qty:qty||'',why}); };
  if(b.kind==='finish'){ ['dryshoes','drysocks','change','hoodie'].forEach(id=>add(id,'','For after you finish')); return out; }
  const x=ctx.wx, h=ctx.hours, span=fmtHrs(ctx.mins)+' to '+ctx.nextName+' at '+ctx.slow.label+' pace';
  ['musher','sanitizer','socks','wipes'].forEach(id=>add(id,'','Foot care kit, every bag'));
  add('salt','1 jewelry bag','Every bag');
  add('tums','','Every bag');
  add('cal',(Math.ceil(200*h/50)*50).toLocaleString('en-US')+' cal','200 per hour, '+span);
  add('tylenol','','Optional, every bag');
  ['chafe','lipbalm','trash'].forEach(id=>add(id,'','Every bag'));
  add('buff','','Every bag');
  const lo='Low of '+fmtT(x.lo)+' before '+ctx.nextName;
  if(x.lo<55) add('lightlayer','',lo);
  if(x.lo<40) ['gloves','tights','extralayer'].forEach(id=>add(id,'',lo));
  if(x.lo<35) add('jacket','',lo);
  if(x.hi>80) ['sunscreen','hat','icebandana','extrasalt'].forEach(id=>add(id,'','High of '+fmtT(x.hi)));
  if(x.rain>=40) ['rainjacket','zipbag'].forEach(id=>add(id,'','Up to '+x.rain+'% chance of rain'));
  if(x.darkMin>0) ['headlamp','batteries','backuplight'].forEach(id=>add(id,'','About '+fmtHrs(x.darkMin)+' in the dark before '+ctx.nextName));
  add('coffee',x.darkMin>=180?'x2':'x1',x.darkMin>=180?'Two for running through the night':'Caffeine, every bag');
  if(b.kind==='drop'){
    let night=false;
    for(let el=ctx.w.early;el<=ctx.w.late+0.01;el+=15){const t=todOf(el);if(isDark(el)||(t>=SAMPLE_SUNRISE&&t<SAMPLE_SUNRISE+120)){night=true;break}}
    if(night) ['toothbrush','mouthwash'].forEach(id=>add(id,'','You may arrive overnight or early morning'));
    if(b.half) ['shoes','shorts','shirt'].forEach(id=>add(id,'','Your drop bag closest to halfway'));
  }
  return out;
}

let dbNew=new Set();
function calNum(q){const n=parseInt(String(q||'').replace(/[^0-9]/g,''),10);return isNaN(n)?0:n}
function calQty(n){return Math.max(0,n).toLocaleString('en-US')+' cal'}   // ids just added, so they drop in with a little bounce
function tileName(it){return esc(it.name)}
function dbBagView(R,bags,k){
  const ctx=dbCtx(R,bags,k), b=ctx.b, w=ctx.w, r=R.rows[b.i], bag=bagOf(b.key);
  const title=b.kind==='start'?'What you start with':b.kind==='finish'?'Your finish bag':esc(b.name);
  const eb=b.kind==='start'?'Start line':b.kind==='finish'?'Finish line':'Drop bag '+b.n+' of '+b.of;
  const mile=b.kind==='start'?'0.0 '+uLabel():dShow(r.dist).toFixed(1)+' '+uLabel();
  let h='<section class="dbpanel"><div class="dbtitle"><span class="eyebrow">'+eb+'</span><h2>'+title+'</h2>'+
    '<span class="muted num">'+mile+(b.half?' · closest drop bag to halfway':'')+'</span></div>';
  // conditions
  h+='<div class="conds">';
  if(b.kind==='start'){
    h+=cond('You start',esc(clk(0)),isDark(0)?'In the dark':'In daylight',isDark(0)?'dark':'');
  } else {
    h+=cond('You arrive',esc(clk(w.early))+'<br>to '+esc(clk(w.late)),esc(w.eLab)+' to '+esc(w.lLab));
    const d1=isDark(w.early),d2=isDark(w.late);
    const lightTxt=d1&&d2?'Dark':!d1&&!d2?'Daylight':(d1?'Dark or daylight':'Daylight or dark');
    const lightNote=d1===d2?(d1?'Arriving after dark':'Arriving in daylight'):(!d1?'Sunset '+fmtClock12(SAMPLE_SUNSET)+', you may arrive after dark':'Sunrise '+fmtClock12(SAMPLE_SUNRISE)+', you may arrive in the dark');
    h+=cond('Light',lightTxt,lightNote,d1&&d2?'dark':'');
  }
  if(b.kind!=='finish'){
    const x=ctx.wx;
    h+='<div class="cond leg"><span class="eyebrow">To '+esc(ctx.nextName)+'</span>'+
       '<span class="v num">'+dShow(ctx.miNext).toFixed(1)+' '+uLabel()+'</span>'+
       '<small class="ai">Next aid station: '+esc(ctx.aidName)+', '+dShow(ctx.miAid).toFixed(1)+' '+uLabel()+'</small>'+
       '<ul class="legs">'+ctx.legs.map(l=>'<li'+(l===ctx.slow?' class="slow"':'')+'><span>'+esc(l.label)+'</span><b class="num">'+fmtHrs(l.mins)+'</b></li>').join('')+'</ul>'+
       '<small class="pk">Suggestions use the slowest time: <b>'+esc(ctx.slow.label)+'</b></small></div>';
    h+=cond('Temperature',fmtT(x.lo)+' to '+fmtT(x.hi),'Low and high before '+esc(ctx.nextName));
    h+=cond('Rain','Up to '+x.rain+'%','Highest chance before '+esc(ctx.nextName));
    h+=cond('Sun',x.events.length?esc(x.events.map(evText).join(', ')):(x.darkMin>0?'Dark':'Daylight'),x.events.length?'Before '+esc(ctx.nextName):'The whole way to '+esc(ctx.nextName),!x.events.length&&x.darkMin>0?'dark':'');
  }
  h+='</div>';

  const sugg=dbSuggest(b,ctx), have=new Set(bag.items.map(it=>it.id)), dis=new Set(bag.dismissed);
  const open=sugg.filter(s=>!have.has(s.id)&&!dis.has(s.id)), nDis=sugg.filter(s=>dis.has(s.id)&&!have.has(s.id)).length;

  h+='<div class="fun">';
  // the bag
  const n=bag.items.length;
  h+='<div class="sackcol"><div class="sack'+(n?'':' empty')+(dbNew.size?' bump':'')+'" id="sack" data-key="'+esc(b.key)+'">'+
     '<span class="hnd" aria-hidden="true"><i></i></span><span class="cap l" aria-hidden="true"></span><span class="cap r" aria-hidden="true"></span><span class="pull" aria-hidden="true"></span>'+
     '<span class="sacktag"><b>'+esc(b.kind==='start'?'Start':b.kind==='finish'?'Finish':b.name)+'</b>'+esc(mile)+'</span>'+
     '<div class="sackhead"><span>'+(b.kind==='start'?'You carry':'In the bag')+'</span><span class="num">'+n+' item'+(n===1?'':'s')+'</span></div>'+
     '<div class="sackin">';
  if(!n) h+='<p class="sackhint">Drag items here<br><small>or tap an item to add it</small></p>';
  bag.items.forEach((it,j)=>{
    h+='<div class="btile'+(dbNew.has(it.id)?' new':'')+'"><span class="bico">'+icon(it.id)+'</span><span class="bnm">'+tileName(it)+'</span>'+
       (it.id==='cal'?'<button type="button" class="bqty cal" data-act="b-calfocus" aria-label="Change calories">'+esc(it.qty||'Set amount')+' ✎</button>':it.qty?'<span class="bqty">'+esc(it.qty)+'</span>':'')+
       '<button type="button" class="bx" data-act="b-rm" data-j="'+j+'" aria-label="Take '+esc(it.name)+' out">×</button></div>';
  });
  h+='</div></div></div>';

  // the shelf
  h+='<div class="shelf">';
  h+='<div class="shelfsec"><div class="shelfh"><h3>Suggested for this bag <span class="muted num">('+open.length+')</span></h3>'+(open.length?'<button type="button" class="btn sm primary" data-act="b-addall">Add all</button>':'')+'</div>';
  if(!open.length) h+='<p class="preview">'+(sugg.length?'You\'ve handled every suggestion for this bag.':'No suggestions for this bag.')+'</p>';
  h+='<div class="tiles sug">';
  open.forEach(s=>{
    h+='<div class="tilewrap"><button type="button" class="tile sug" data-drag data-act="b-add" data-id="'+s.id+'" title="'+esc(s.why)+'">'+
       '<span class="tico">'+icon(s.id)+'</span><span class="tnm">'+esc(s.name)+'</span>'+(s.qty&&s.id==='cal'?'<span class="tqty">'+esc(s.qty)+'</span>':'')+

  h+='</div>';
  if(nDis) h+='<button type="button" class="linkbtn" data-act="b-restore">Bring back '+nDis+' skipped suggestion'+(nDis>1?'s':'')+'</button>';
  h+='</div>';

  h+='<div class="shelfsec"><div class="shelfh"><h3>Common items</h3><span class="muted" style="font-size:.85rem">Drag into the bag or tap</span></div>';
  const groups=DB_CATS.map(([c,l])=>[l,DB_LIB.filter(x=>x.cat===c)]);
  if(bp.custom.length) groups.unshift(['My items',bp.custom]);
  groups.forEach(([l,items])=>{
    h+='<div class="libcat"><span class="eyebrow">'+esc(l)+'</span><div class="tiles">'+items.map(x=>{
      const inBag=have.has(x.id), mine=bp.custom.some(c=>c.id===x.id);
      return '<div class="tilewrap"><button type="button" class="tile'+(inBag?' in':'')+'"'+(inBag?' disabled':' data-drag')+' data-act="b-lib" data-id="'+esc(x.id)+'">'+
        '<span class="tico">'+icon(x.id)+'</span><span class="tnm">'+esc(x.name)+'</span>'+(inBag?'<span class="tin">In bag</span>':'')+'</button>'+
        (mine?'<button type="button" class="tx" data-act="b-unmine" data-id="'+esc(x.id)+'" aria-label="Delete '+esc(x.name)+' from my items">×</button>':'')+'</div>';
    }).join('')+'</div></div>';
  });
  h+='<div class="libcat"><label class="eyebrow" for="db-cname">Add your own item</label><div class="addrow"><input class="in" id="db-cname" placeholder="e.g. Salted Coke vial" autocomplete="off">'+
     '<select class="in" id="db-ccat" aria-label="Category" style="flex:0 1 11rem">'+DB_CATS.map(([c,l])=>'<option value="'+c+'">'+esc(l)+'</option>').join('')+'</select>'+
     '<button type="button" class="btn" data-act="b-custom">Add</button></div><span class="muted" style="font-size:.82rem">It goes in this bag and into My items for other bags.</span></div>';
  h+='</div></div></div>';

  // amounts
  h+='<div class="box"><div class="boxh teal"><span>Packing list and amounts</span><span class="num">'+n+'</span></div><div class="boxb">';
  if(!n) h+='<p class="preview">Items you add show up here so you can rename them or set amounts.</p>';
  else h+='<div class="itemhead"><span>Item</span><span>Amount</span><span></span></div>';
  const calRec=(sugg.find(x=>x.id==='cal')||{}).qty||'';
  bag.items.forEach((it,j)=>{
    if(it.id==='cal'){
      const v=calNum(it.qty), rv=calNum(calRec);
      h+='<div class="calbox"><div class="itemrow"><input class="in" id="db-n'+j+'" data-bf="name" data-j="'+j+'" autocomplete="off" value="'+esc(it.name)+'" aria-label="Item name">'+
         '<div class="calstep"><button type="button" class="btn sm" data-act="b-cal" data-j="'+j+'" data-d="-100" aria-label="100 fewer calories">−</button>'+
         '<input class="in num" id="db-q'+j+'" data-cal="'+j+'" inputmode="numeric" autocomplete="off" value="'+(v?v.toLocaleString('en-US'):'')+'" aria-label="Calories">'+
         '<button type="button" class="btn sm" data-act="b-cal" data-j="'+j+'" data-d="100" aria-label="100 more calories">+</button></div>'+
         '<button type="button" class="rm" data-act="b-rm" data-j="'+j+'" aria-label="Remove '+esc(it.name)+'">×</button></div>';
      if(rv) h+='<p class="calrec">Recommended <b class="num">'+esc(calRec)+'</b>: 200 per hour for '+fmtHrs(ctx.mins)+' at '+esc(ctx.slow.label)+' pace'+(v!==rv?' <button type="button" class="linkbtn" data-act="b-calrec" data-j="'+j+'" data-v="'+rv+'">Use recommended</button>':'')+'</p>';
      h+='</div>';
      return;
    }
    h+='<div class="itemrow"><input class="in" id="db-n'+j+'" data-bf="name" data-j="'+j+'" autocomplete="off" value="'+esc(it.name)+'" aria-label="Item name">'+
       '<input class="in" id="db-q'+j+'" data-bf="qty" data-j="'+j+'" autocomplete="off" value="'+esc(it.qty)+'" placeholder="Amount" aria-label="Amount for '+esc(it.name)+'">'+
       '<button type="button" class="rm" data-act="b-rm" data-j="'+j+'" aria-label="Remove '+esc(it.name)+'">×</button></div>';
  });
  h+='</div></div></section>';
  return h;
}


function dbMorning(){
  let h='<section class="dbpanel"><div><h2>Race morning to-do list</h2><p class="preview" style="margin-top:6px;max-width:70ch">Things to do before the start that aren\'t packed in a bag. This list prints with your checklist.</p></div><div class="mlist">';
  bp.morning.forEach((m,j)=>{
    h+='<div class="itemrow two"><input class="in" id="db-m'+j+'" data-mi="'+j+'" autocomplete="off" value="'+esc(m.text)+'" aria-label="To-do '+(j+1)+'"><button type="button" class="rm" data-act="b-mrm" data-j="'+j+'" aria-label="Remove '+esc(m.text)+'">×</button></div>';
  });
  if(!bp.morning.length) h+='<p class="preview">Nothing on the list yet.</p>';
  h+='</div><div class="addrow"><input class="in" id="db-madd" placeholder="e.g. Drop bags at check-in by 5:00 AM" autocomplete="off"><button type="button" class="btn" data-act="b-madd">Add to-do</button></div></section>';
  return h;
}

function dbSummary(R,bags){
  let h='<section class="dbpanel"><div><h2>Your packing checklist</h2><p class="preview" style="margin-top:6px;max-width:70ch">Everything you planned, bag by bag. A printable version and bag labels come in a later step.</p></div><div class="sumgrid">';
  if(bp.morning.length) h+='<div class="box"><div class="boxh"><span>Race morning</span></div><div class="boxb"><ul>'+bp.morning.map(m=>'<li>'+esc(m.text)+'</li>').join('')+'</ul></div></div>';
  bags.forEach(b=>{
    const bag=bagOf(b.key), w=dbWin(R,b.i), r=R.rows[b.i];
    const sub=b.kind==='start'?'Start, '+clk(0):b.kind==='finish'?'Finish':dShow(r.dist).toFixed(1)+' '+uLabel()+', '+clk(w.early)+' to '+clk(w.late);
    h+='<div class="box"><div class="boxh'+(b.kind==='drop'?' teal':'')+'"><span>'+esc(b.kind==='start'?'Start':b.kind==='finish'?'Finish bag':b.name)+'</span><span class="num" style="font-weight:500;font-size:.85rem">'+bag.items.length+'</span></div><div class="boxb"><small class="muted">'+esc(sub)+'</small>'+
      (bag.items.length?'<ul>'+bag.items.map(it=>'<li>'+esc(it.name)+(it.qty?' <span class="muted">('+esc(it.qty)+')</span>':'')+'</li>').join('')+'</ul>':'<p class="preview">Nothing packed yet.</p>')+'</div></div>';
  });
  return h+'</div></section>';
}

function dbGo(step){
  const R=compute(chart), bags=dbBags(R);
  if(step!=='pick' && !bp.picks.some(k=>bags.some(b=>b.key===k))){ dbErr='Check at least one aid station where you\'ll have a drop bag.'; bp.step='pick'; }
  else { dbErr=''; bp.step=step; }
  bpSave(); render(); window.scrollTo(0,0);
}
function dbAct(a,btn){
  const R=compute(chart), bags=dbBags(R), steps=dbStepList(bags), st=dbCurStep(bags), cur=steps.findIndex(s=>s[0]===st);
  const key=st.startsWith('b:')?st.slice(2):null, bag=key?bagOf(key):null;
  if(a==='b-open'){view='bags';dbErr='';copyText=null;render();window.scrollTo(0,0);return}
  if(a==='b-exit'){view='chart';dbErr='';render();window.scrollTo(0,0);return}
  if(a==='b-go'){dbGo(btn.dataset.step);return}
  if(a==='b-next'&&steps[cur+1]){dbGo(steps[cur+1][0]);return}
  if(a==='b-back'&&steps[cur-1]){dbGo(steps[cur-1][0]);return}
  if(bag){
    const k=bags.findIndex(b=>b.key===key), sugg=dbSuggest(bags[k],dbCtx(R,bags,k));
    const have=new Set(bag.items.map(it=>it.id));
    if(a==='b-add'){const s=sugg.find(x=>x.id===btn.dataset.id); if(s&&!have.has(s.id)){bag.items.push({id:s.id,name:s.name,qty:s.qty});dbNew.add(s.id)}
      if(s&&s.id==='headlamp'&&!bag.items.some(it=>it.id==='batteries')){const bs=sugg.find(x=>x.id==='batteries');bag.items.push({id:'batteries',name:DB_BYID.batteries.name,qty:bs?bs.qty:''});dbNew.add('batteries')}}
    if(a==='b-addall'){sugg.forEach(s=>{if(!have.has(s.id)&&!bag.dismissed.includes(s.id)){bag.items.push({id:s.id,name:s.name,qty:s.qty});dbNew.add(s.id)}});}
    if(a==='b-dismiss'){if(!bag.dismissed.includes(btn.dataset.id)) bag.dismissed.push(btn.dataset.id);}
    if(a==='b-restore'){bag.dismissed=[];}
    if(a==='b-rm'){bag.items.splice(+btn.dataset.j,1);}
    if(a==='b-cal'){const it=bag.items[+btn.dataset.j]; if(it) it.qty=calQty(calNum(it.qty)+(+btn.dataset.d));}
    if(a==='b-calrec'){const it=bag.items[+btn.dataset.j]; if(it) it.qty=calQty(+btn.dataset.v);}
    if(a==='b-lib'){const id=btn.dataset.id, x=DB_BYID[id]||bp.custom.find(c=>c.id===id); if(x&&!have.has(id)){bag.items.push({id,name:x.name,qty:''});dbNew.add(id)}
      if(id==='headlamp'&&!have.has('batteries')&&!bag.items.some(it=>it.id==='batteries')){bag.items.push({id:'batteries',name:DB_BYID.batteries.name,qty:''});dbNew.add('batteries')}}
    if(a==='b-custom'){
      const n=document.getElementById('db-cname'), c=document.getElementById('db-ccat'), name=(n&&n.value||'').trim();
      if(!name){dbErr='Type a name for your item first.';render();const el=document.getElementById('db-cname');if(el)el.focus();return}
      let x=bp.custom.find(cu=>cu.name.toLowerCase()===name.toLowerCase());
      if(!x){x={id:'c_'+Date.now().toString(36),name,cat:c?c.value:'other'};bp.custom.push(x)}
      if(!have.has(x.id)){bag.items.push({id:x.id,name:x.name,qty:''});dbNew.add(x.id)}
      dbErr='';
    }
  }
  if(a==='b-calfocus'){const el=document.querySelector('[data-cal]'); if(el){el.closest('.calbox').scrollIntoView({block:'center',behavior:'smooth'}); el.focus({preventScroll:true}); el.select(); const bx=el.closest('.calbox'); bx.classList.remove('flash'); void bx.offsetWidth; bx.classList.add('flash');} return;}
  if(a==='b-unmine'){bp.custom=bp.custom.filter(c=>c.id!==btn.dataset.id);}
  if(a==='b-mrm'){bp.morning.splice(+btn.dataset.j,1);}
  if(a==='b-madd'){const n=document.getElementById('db-madd'), t=(n&&n.value||'').trim(); if(t) bp.morning.push({text:t}); bpSave(); render(); const el=document.getElementById('db-madd'); if(el) el.focus(); return;}
  bpSave(); render(); dbNew.clear();
  if(a==='b-custom'){const el=document.getElementById('db-cname'); if(el) el.focus();}
}

/* ---------- render + events ---------- */
const app=document.getElementById('app');
function render(){
  app.innerHTML = view==='chart'?renderChart():view==='bags'?renderBags():renderWizard();
  if(copyText!=null){const t=document.getElementById('copyfall');if(t){t.focus();t.select()}}
}

app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.set){
    const k=b.dataset.set,v=b.dataset.val;
    if(k==='margin') chart.margin=+v; else chart[k]=v;
    save(); render(); return;
  }
  const a=b.dataset.act; if(!a) return;
  if(a.startsWith('b-')){ if(Date.now()-dragEndedAt<300) return; dbAct(a,b);return}
  if(a==='new'){wiz=newDraft(null);wizErr='';view='wiz';copyText=null;render();window.scrollTo(0,0)}
  if(a==='edit'){wiz=newDraft(chart);wiz.editing=true;wizErr='';view='wiz';copyText=null;render();window.scrollTo(0,0)}
  if(a==='cancel'){view='chart';wiz=null;render()}
  if(a==='example'){wiz=newDraft(EXAMPLE);wizErr='';render()}
  if(a==='back'){readWizInputs();wizErr='';wiz.step--;render()}
  if(a==='addrow'){readWizInputs();wiz.rows.splice(wiz.rows.length-1,0,{name:'',distText:'',cutText:''});render();
    const el=document.getElementById('w-n'+(wiz.rows.length-2)); if(el) el.focus()}
  if(a==='addplan'){readWizInputs(); if(wiz.plans.length<MAX_PLANS){
      const used=new Set(wiz.plans.map(p=>p.label.trim().toLowerCase()));
      const name=PLAN_NAMES.find(n=>!used.has(n.toLowerCase()))||('Goal '+(wiz.plans.length+1));
      wiz.plans.push({label:name,timeText:''}); wizErr=''; render();
      const el=document.getElementById('w-pt'+(wiz.plans.length-1)); if(el) el.focus(); } }
  if(a==='rmplan'){readWizInputs(); if(wiz.plans.length>1){ wiz.plans.splice(+b.dataset.i,1); wizErr=''; render(); } }
  if(a==='rmrow'){readWizInputs();wiz.rows.splice(+b.dataset.i,1);render()}
  if(a==='paste'){readWizInputs();const t=document.getElementById('w-paste').value;const rows=parsePaste(t);
    if(!rows){wizErr='Couldn\'t read those rows. Each line needs a name and a distance.';render();return}
    wiz.rows=rows;wizErr='';render()}
  if(a==='copy'){
    const t=tableTSV();
    try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied';setTimeout(()=>{b.textContent='Copy table'},1600)},()=>{copyText=t;render()})}
    catch(err){copyText=t;render()}
  }
  if(a==='closecopy'){copyText=null;render()}
  if(a==='next'){goNext()}
  if(a==='pdf'){savePdf()}
});
app.addEventListener('change',e=>{
  if(view==='wiz' && wiz && wiz.step===1 && (e.target.name==='w-unit'||e.target.name==='w-cf')){readWizInputs();render()}
  if(view==='bags'){
    const t=e.target;
    if(t.dataset.pick!=null){const k=t.dataset.pick;bp.picks=bp.picks.filter(x=>x!==k);if(t.checked)bp.picks.push(k);dbErr='';bpSave();render()}
    if(t.id==='db-date'&&t.value){chart.startDate=t.value;save();render()}
  }
});
app.addEventListener('input',e=>{
  if(view!=='bags') return;
  const t=e.target;
  if(t.dataset.bf){const st=bp.step||'';if(!st.startsWith('b:'))return;const it=bagOf(st.slice(2)).items[+t.dataset.j];if(it){it[t.dataset.bf]=t.value;bpSave()}}
  if(t.dataset.cal!=null){const st=bp.step||'';if(!st.startsWith('b:'))return;const it=bagOf(st.slice(2)).items[+t.dataset.cal];if(it){it.qty=calQty(calNum(t.value));bpSave()}}
  if(t.dataset.mi!=null){const m=bp.morning[+t.dataset.mi];if(m){m.text=t.value;bpSave()}}
});
// Next works as a plain button (no form submit), because embedded frames can block form submissions.
function goNext(){
  if(view!=='wiz'||!wiz) return;
  const err=validateStep(); wizErr=err;
  if(err){ render(); const el=document.querySelector('.err'); if(el&&el.scrollIntoView) el.scrollIntoView({block:'center'}); return; }
  if(wiz.step<3){ wiz.step++; render(); window.scrollTo(0,0); } else finishWizard();
}
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing) return;
  const t=e.target;
  if(t&&(t.id==='db-cname'||t.id==='db-madd')){e.preventDefault();dbAct(t.id==='db-cname'?'b-custom':'b-madd',t);return} if(!(t&&t.tagName==='INPUT'&&t.closest('#wizform'))) return;
  if(t.type==='radio'||t.type==='checkbox') return;
  e.preventDefault(); goNext();
});

/* drag and drop: mouse drags right away; on touch, press and hold briefly, then drag (a quick swipe still scrolls). Tap adds. */
let drag=null, dragEndedAt=0;
function overSack(x,y){const s=document.getElementById('sack');if(!s)return false;const r=s.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
function dragStart(){
  if(!drag||drag.on) return;
  drag.on=true;
  const r=drag.el.getBoundingClientRect(), g=drag.el.cloneNode(true);
  g.classList.add('ghost'); g.removeAttribute('data-drag'); g.style.width=r.width+'px';
  drag.dx=drag.x-r.left; drag.dy=drag.y-r.top; drag.ghost=g; document.body.appendChild(g);
  drag.el.classList.add('lifting');
  dragMove(drag.x,drag.y);
  try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
}
function dragMove(x,y){
  if(!drag||!drag.on) return;
  drag.ghost.style.transform='translate('+(x-drag.dx)+'px,'+(y-drag.dy)+'px) rotate(-4deg) scale(1.06)';
  const s=document.getElementById('sack'); if(s) s.classList.toggle('over',overSack(x,y));
}
function dragEnd(x,y,cancel){
  if(!drag) return;
  clearTimeout(drag.timer);
  const d=drag; drag=null;
  if(!d.on) return;
  dragEndedAt=Date.now();
  d.ghost.remove(); d.el.classList.remove('lifting');
  const s=document.getElementById('sack'); if(s) s.classList.remove('over');
  if(!cancel&&overSack(x,y)) dbAct(d.el.dataset.act,d.el);
}
app.addEventListener('pointerdown',e=>{
  if(view!=='bags'||(e.pointerType==='mouse'&&e.button!==0)) return;
  const t=e.target.closest('[data-drag]'); if(!t) return;
  drag={el:t,x:e.clientX,y:e.clientY,pid:e.pointerId,touch:e.pointerType!=='mouse',on:false,timer:null};
  if(drag.touch) drag.timer=setTimeout(dragStart,220);
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6) return;
    if(drag.touch){clearTimeout(drag.timer);drag=null;return}   // a swipe: let the page scroll
    dragStart();
  }
  dragMove(e.clientX,e.clientY);
});
window.addEventListener('pointerup',e=>{ if(drag&&e.pointerId===drag.pid) dragEnd(e.clientX,e.clientY,false); });
window.addEventListener('pointercancel',e=>{ if(drag&&e.pointerId===drag.pid) dragEnd(0,0,true); });
document.addEventListener('touchmove',e=>{ if(drag&&drag.on) e.preventDefault(); },{passive:false});
document.addEventListener('contextmenu',e=>{ if(drag||(e.target.closest&&e.target.closest('[data-drag]'))) e.preventDefault(); });
document.addEventListener('dragstart',e=>{ if(e.target.closest&&e.target.closest('[data-drag]')) e.preventDefault(); });

// Testing shortcut: opening the link with #demo fills setup with the example race. Not shown to users.
function isDemo(){try{return location.hash==='#demo'}catch(e){return false}}
if(isDemo()){view='wiz';wiz=newDraft(EXAMPLE);}
else if(view==='wiz') wiz=newDraft(null);
try{window.addEventListener('hashchange',()=>{if(isDemo()){view='wiz';wiz=newDraft(EXAMPLE);wizErr='';render()}})}catch(e){}
render();

// expose for testing
window.__pace={compute,parseDur,parseClock,EXAMPLE,dbBags,dbCtx,dbSuggest,get bp(){return bp}};
})();
