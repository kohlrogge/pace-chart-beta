<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Race Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap">
<style>
/* Layout: full-width brand bands like the website (teal header, light grey spacer), then a centered working column with purple and black section bars, black-capped cards and a black-headed table.
   Single light look by design, matching thewomens100milerproject.com: teal #0F485A, purple #361269, mint #B5DDD4, light grey #C4D3D5, black, white. */
:root{
  --teal:#0f485a; --purple:#361269; --mint:#b5ddd4; --grey:#c4d3d5; --black:#000000; --white:#ffffff;
  --bg:#ffffff; --surface:#ffffff; --ink:#111111; --muted:#4a5a60; --line:#c4d3d5; --row:#eef3f4;
  --accent:#0f485a; --accent-ink:#ffffff; --accent-soft:#e6f2ef;
  --cut:#c62828; --cut-soft:#fdeaea; --warn:#a15c00; --ok:#1f7a48; --adj:#8a5300; --adjbg:#fff1d6;
  --display:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
  --label:"Poppins","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:clip}
.wrap{max-width:1080px;margin:0 auto;padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.bleed{width:100vw;margin-left:calc(50% - 50vw)}
.bleed-inner{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.1}
h1 .kind{color:var(--mint);white-space:nowrap}
h1{font-size:2.2rem;color:var(--white);text-shadow:0 0 12px rgba(255,255,255,.35)}
h2{font-size:1.5rem;color:var(--ink)}
.eyebrow{font-family:var(--label);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}

/* brand header band */
.top{background:var(--teal);color:var(--white)}
.top .bleed-inner{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-block:22px}
.top .eyebrow{color:rgba(255,255,255,.8)}
.top .muted{color:rgba(255,255,255,.85)}
.greyband{background:var(--grey);height:22px;margin-bottom:4px}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.brand img{width:72px;height:72px;flex:none;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.brand .title{display:flex;flex-direction:column;gap:4px;min-width:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:2px solid var(--black);background:var(--white);color:var(--black);border-radius:8px;padding:7px 14px;font-family:var(--label);font-weight:600;font-size:.9rem}
.btn:hover{background:var(--row)}
.btn.primary{background:var(--purple);color:var(--white);border-color:var(--purple)}
.btn.primary:hover{background:#4a1d8a}
.btn.ghost{background:transparent}
.top .btn{border-color:var(--white);background:transparent;color:var(--white)}
.top .btn:hover{background:rgba(255,255,255,.12)}
.top .btn.primary{background:var(--white);color:var(--teal)}
.top .btn.primary:hover{background:var(--mint)}
.btn[disabled]{opacity:.4;cursor:default}

/* section bars */
.bar{font-family:var(--display);font-weight:700;font-size:1.5rem;text-align:center;color:var(--white);padding:10px 16px;border-radius:0}
.bar.purple{background:var(--purple)}
.bar.black{background:var(--black);font-weight:500;text-shadow:0 0 10px rgba(255,255,255,.4)}

.banner{background:var(--grey);padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.banner p{margin:0;max-width:75ch}

.controls{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:center}
.ctl{display:flex;flex-direction:column;gap:6px;align-items:center}
.seg{display:inline-flex;border:2px solid var(--black);border-radius:8px;overflow:hidden;background:var(--white)}
.seg button{border:0;background:transparent;padding:6px 14px;font-family:var(--label);font-weight:600;font-size:.85rem;color:var(--black)}
.seg button+button{border-left:2px solid var(--black)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--white)}
.seg.small{border-color:var(--white);background:transparent}
.seg.small button{padding:3px 9px;font-size:.75rem;color:var(--white)}
.seg.small button+button{border-left-color:var(--white)}
.seg.small button[aria-pressed="true"]{background:var(--white);color:var(--black)}

/* plan cards: black cap like the exercise cards */
.cards{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:16px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--grey);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:0 16px 16px;min-width:0;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card > .row:first-child{background:var(--black);color:var(--white);margin:0 -16px 4px;padding:10px 16px;min-height:50px;box-sizing:border-box}
.card > .row:first-child .eyebrow{color:var(--white);font-size:.95rem;letter-spacing:.02em;text-transform:none;font-weight:700}
.card .big{color:var(--ink);font-family:var(--display);font-size:2.3rem;font-weight:700;line-height:1}
.card .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.card.plain{padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--label);font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;align-self:flex-start}
.chip.ok{color:var(--white);background:var(--ok)}
.chip.bad{color:var(--white);background:var(--cut)}
.card p{margin:0;font-size:.9rem}

/* course strip */
.strip{padding:6px 0}
.strip svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:4px;height:14px;vertical-align:-3px;margin-right:6px}

/* table */
.tablebox{border:1px solid var(--grey);border-radius:14px;overflow-x:auto;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;vertical-align:middle;border-bottom:1px solid #dde6e8;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:130px}
thead th{font-family:var(--label);font-weight:500;font-size:.8rem;color:rgba(255,255,255,.8);background:var(--black)}
thead th .hl{display:block;font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--white)}
tbody tr:nth-child(even) td{background:var(--row)}
tbody tr:last-child td{border-bottom:0}
td .t{font-weight:700;font-size:1rem}
td.cutcol .t.hard{color:var(--cut)}
td.cutcol .t.est{color:var(--muted);font-weight:400}
td .day{font-size:.72rem;color:var(--muted);font-weight:700;margin-right:4px}
td.miss{box-shadow:inset 4px 0 0 var(--cut)}
tbody tr td.adj{background:var(--adjbg)}
td.adj .t{color:var(--adj)}
.adjkey{display:inline-block;width:18px;height:12px;border-radius:2px;background:#f6d48f;vertical-align:-1px;margin-right:6px}
.chip.adj{color:var(--black);background:var(--adjbg);border:1px solid var(--adj)}
.seg button[disabled]{color:#9aa7ab;cursor:not-allowed}
.stn{font-weight:700}
.stn small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}

.foot{font-size:.84rem;color:var(--muted);max-width:80ch;margin:0 auto;text-align:center}
.copyfall{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:.8rem}

/* wizard */
.wiz{border:1px solid var(--grey);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:20px;background:var(--surface)}
.steps{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}

.btile{position:relative;background:var(--white);border-radius:12px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.bico{width:38px;height:38px}
.bnm{font-size:.68rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.bqty{font-size:.64rem;font-weight:700;color:var(--white);background:var(--purple);border-radius:999px;padding:1px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sack,.tile,.btile{-webkit-user-select:none;user-select:none}
.bqty.cal{border:0;font:inherit;font-size:.66rem;font-weight:700;cursor:pointer}
.bqty.cal:hover{background:#4a1d8a}
@media (prefers-reduced-motion:no-preference){.calbox.flash{animation:flash 1.2s ease-out}@keyframes flash{0%{box-shadow:0 0 0 4px var(--purple)}100%{box-shadow:0 0 0 0 transparent}}}
.bx{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--black);background:var(--white);font-size:.85rem;line-height:1;padding:0;display:grid;place-items:center}
.bx:hover{background:var(--cut-soft);color:var(--cut)}
@media (max-width:859px){.sack{padding:16px 30px 32px}.sack::after{left:26px;right:26px}.sack .pull{right:36px}.sack .hnd{left:16%;right:16%}.sackcol{margin-inline:-14px;padding-inline:14px;box-shadow:0 10px 12px -10px rgba(0,0,0,.2)}.sackin{min-height:96px;max-height:26vh;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}.sackhint{padding:14px 8px}.bico{width:30px;height:30px}}
.shelf{display:flex;flex-direction:column;gap:22px;min-width:0}
.shelfsec{display:flex;flex-direction:column;gap:12px}
.shelfh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.shelfh h3{font-size:1.1rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tiles.sug{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
.tilewrap{position:relative;display:flex;min-width:0}
.tile{flex:1;min-width:0;border:2px solid var(--grey);background:var(--white);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-weight:700;font-size:.78rem;line-height:1.2;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile:hover{border-color:var(--teal)}
.tile.sug{border-color:var(--teal);background:var(--accent-soft)}
.tico{width:44px;height:44px;pointer-events:none}
.tnm{overflow-wrap:anywhere}
.tqty{font-size:.72rem;color:var(--white);background:var(--teal);border-radius:999px;padding:1px 8px}
.twhy{font-weight:400;font-size:.7rem;color:var(--muted)}
.alert{display:flex;gap:12px;align-items:center;background:#fff4d6;border:2px solid #f2b632;border-left-width:8px;border-radius:12px;padding:10px 14px;color:var(--ink)}
.alert.info{background:#eef1fb;border-color:var(--purple)}
.alert.ok{background:var(--accent-soft);border-color:var(--teal)}
.alert .aico{width:40px;height:40px;flex:none}
.alert b{font-family:var(--label)}
.tile.must{border-color:#f2b632;background:#fff4d6;box-shadow:0 0 0 2px #f2b632}
.mustb{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:#f2b632;color:var(--black);border-radius:999px;padding:1px 8px}
.tile.in{cursor:default;opacity:.55;border-style:dashed}
.tin{font-size:.66rem;color:var(--teal)}
.tx{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--grey);background:var(--white);color:var(--muted);font-size:.85rem;line-height:1;padding:0;display:grid;place-items:center}
.tx:hover{border-color:var(--cut);color:var(--cut)}
.tile.lifting{opacity:.35}
.dragghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;margin:0;box-shadow:0 14px 28px rgba(0,0,0,.28);border-color:var(--purple)!important;background:var(--white)!important;cursor:grabbing}
@media (prefers-reduced-motion:no-preference){
  .btile.new{animation:drop .45s cubic-bezier(.3,1.4,.5,1)}
  .sack.bump{animation:bump .35s ease-out}
  @keyframes drop{0%{transform:translateY(-36px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
  @keyframes bump{0%{transform:none}35%{transform:scale(1.03,.97)}70%{transform:scale(.99,1.01)}100%{transform:none}}
}

</style>

// Older saved charts had exactly two goals stored as goal/mid; convert them to the plan list.
function normalize(c){
  if(!c) return c;
  if(!Array.isArray(c.plans)){
    const L=c.labels||{}; c.plans=[];
    if(c.goal!=null) c.plans.push({label:L.goal||'Goal',time:c.goal});
    if(c.mid!=null) c.plans.push({label:L.mid||'B Goal',time:c.mid});
  }
  c.labels={cut:(c.labels&&c.labels.cut)||'Cutoff'};
  delete c.goal; delete c.mid;
  return c;
}

function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const pad = n => String(n).padStart(2,'0');

/* ---------- time helpers ---------- */
function fmtDur(min){const m=Math.round(min);const s=m<0?'-':'';const a=Math.abs(m);return s+Math.floor(a/60)+':'+pad(a%60)}
function parseDur(str){
  str=String(str||'').trim(); if(!str) return null;
  let m=str.match(/^(\d{1,3})(?::(\d{1,2}))?$/); if(!m) return NaN;
  const mm = m[2]===undefined?0:+m[2]; if(mm>59) return NaN;
  return (+m[1])*60+mm;
}
function parseClock(str){
  str=String(str||'').trim().toLowerCase().replace(/\./g,''); if(!str) return null;
  let m=str.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?$/); if(!m) return NaN;
  let h=+m[1], mm=m[2]===undefined?0:+m[2]; const ap=m[3];
  if(mm>59) return NaN;
  if(ap){ if(h<1||h>12) return NaN; if(ap[0]==='p'&&h!==12) h+=12; if(ap[0]==='a'&&h===12) h=0; }
  else if(h>23) return NaN;
  return h*60+mm;
}
function fmtClock12(tod){tod=((Math.round(tod)%1440)+1440)%1440;const h=Math.floor(tod/60),m=tod%60;const ap=h<12?'AM':'PM';const h12=h%12===0?12:h%12;return h12+':'+pad(m)+' '+ap}
function fmtTime24(tod){return pad(Math.floor(tod/60))+':'+pad(tod%60)}
function dayLabel(dayIdx){
  if(chart.startDate){
    const d=new Date(chart.startDate+'T12:00:00'); if(!isNaN(d)){d.setDate(d.getDate()+dayIdx);return d.toLocaleDateString('en-US',{weekday:'short'})}
  }
  return 'Day '+(dayIdx+1);
}
function clockParts(elapsed){const tot=chart.startTime+Math.round(elapsed);return {day:Math.floor(tot/1440),text:fmtClock12(tot%1440)}}
function showTime(elapsed){
  if(chart.display==='clock'){const c=clockParts(elapsed);return '<span class="day">'+esc(dayLabel(c.day))+'</span>'+c.text}
  return fmtDur(elapsed);
}
function showTimePlain(elapsed){
  if(chart.display==='clock'){const c=clockParts(elapsed);return dayLabel(c.day)+' '+c.text}
  return fmtDur(elapsed);
}
function fmtPace(minPerUnit){if(!isFinite(minPerUnit))return '';let m=Math.floor(minPerUnit),s=Math.round((minPerUnit-m)*60);if(s===60){m++;s=0}return m+':'+pad(s)}
const uLabel = () => chart.unit==='km'?'km':'mi';
const dShow = mi => chart.unit==='km'?mi*KM:mi;
const paceOf = (min,mi) => chart.unit==='km'? min/(mi*KM) : min/mi;

/* ---------- calculation ---------- */
function marginOf(c){return (c.margin==null||isNaN(c.margin))?15:c.margin}
// Validation shared by setup and the chart's margin buttons. Returns '' when the margin works.
function marginIssue(m,stations,plans,total){
  if(!Number.isInteger(m)||m<0||m>120) return 'Enter the cutoff margin as whole minutes from 0 to 120.';
  const first=stations.slice(1,-1).find(s=>s.cutoff!=null);
  if(first && m>=first.cutoff) return 'A '+m+' minute margin is longer than the time to the first cutoff ('+esc(first.name)+' at '+fmtDur(first.cutoff)+'). Use less than '+first.cutoff+' minutes.';
  for(const p of plans){
    if(p.time>total-m) return 'Your '+esc(p.label)+' time ('+fmtDur(p.time)+') finishes less than '+m+' minutes before the overall cutoff. Make it '+fmtDur(total-m)+' or faster, or use a smaller margin.';
  }
  return '';
}
/* Advanced pacing: each section becomes "effort miles" so climbs get more time and runnable descents less.
   Climb: 1,000 ft counts as 1.9 extra miles (ITRA's 100 m = 1 km, converted). Descent per 1,000 ft, from
   Langmuir's corrections: runnable -0.5 mi, mixed 0 (ITRA ignores descent), steep or technical +0.5 mi.
   A section never counts as less than half its real distance. The goal time is then shared out by effort. */
const DESC_K={runnable:-0.5,mixed:0,steep:0.5}, CLIMB_MI=1.9, FT_PER_M=3.28084;
function effortOf(c){
  const st=c.stations, k=DESC_K[c.descent]!=null?DESC_K[c.descent]:0; let e=0;
  return st.map((s,i)=>{ if(!i) return 0; const seg=s.dist-st[i-1].dist, g=+s.gain||0, l=+s.loss||0;
    e+=Math.max(seg*0.5,seg+CLIMB_MI*g/1000+k*l/1000); return e; });
}
const eLabel=()=>chart.unit==='km'?'m':'ft';
const eShow=ft=>Math.round(chart.unit==='km'?ft/FT_PER_M:ft).toLocaleString('en-US');
function elevText(r){ if(r.first) return ''; const g=+r.gain||0,l=+r.loss||0; return (g||l)?'+'+eShow(g)+' / -'+eShow(l):''; }
const DESC_OPTS=[['runnable','Runnable'],['mixed','Mixed'],['steep','Steep or technical']];
function compute(c){
  if(c.manual) return computeManual(c);
  const st=c.stations, last=st.length-1, D=st[last].dist, T=c.total;
  const E=c.adv?effortOf(c):st.map(s=>s.dist), ED=E[last];
  const rows=st.map((s,i)=>{
    let hard=false,cut;
    if(i===0){cut=0}
    else if(i===last){cut=T;hard=true}
    else if(s.cutoff!=null){cut=s.cutoff;hard=true}
    else cut=T*E[i]/ED;
    return {name:s.name,dist:s.dist,seg:i?s.dist-st[i-1].dist:0,e:E[i],gain:s.gain,loss:s.loss,cut,hard,first:i===0,last:i===last};
  });
  const M = marginOf(c);
  function plan(target){
    // Even pace between anchors (even effort in advanced mode: d is effort miles there). Start at 0 and the finish at the
    // target are anchors; any posted cutoff the plan would reach later than (cutoff - margin) becomes an anchor at exactly (cutoff - margin). Repeat until none.
    const anchors=[{i:0,d:0,t:0},{i:rows.length-1,d:ED,t:target}];
    const pinned=new Set();
    const interp=()=>rows.map(r=>{
      let k=0; while(k<anchors.length-2 && anchors[k+1].d<r.e) k++;
      const a=anchors[k],b=anchors[k+1]; return a.t+(b.t-a.t)*(r.e-a.d)/(b.d-a.d);
    });
    let times=interp();
    for(let guard=0; guard<rows.length; guard++){
      let worst=null;
      rows.forEach((r,i)=>{ if(!r.hard||r.first||r.last||pinned.has(i))return;
        const over=times[i]-(r.cut-M); if(over>0.01&&(!worst||over>worst.over)) worst={i,over}; });
      if(!worst) break;
      pinned.add(worst.i);
      anchors.push({i:worst.i,d:rows[worst.i].e,t:rows[worst.i].cut-M});
      anchors.sort((x,y)=>x.d-y.d);
      times=interp();
    }
    let misses=[], tight=null;
    rows.forEach((r,i)=>{ if(!r.hard||r.first)return; const b=r.cut-times[i];
      if(b<-0.5) misses.push({i,b}); else if(!tight||b<tight.b) tight={i,b}; });
    return {target,times,misses,tight,pinned};
  }
  let limit=Infinity, limitAt=null;
  rows.forEach((r,i)=>{ if(r.hard&&r.e>0){const f=r.cut/r.e*ED; if(f<limit){limit=f;limitAt=i}} });
  return {rows,D,ED,adv:!!c.adv,T,plans:c.plans.map(p=>Object.assign(plan(p.time),{label:p.label})),margin:M,limit,limitAt,hardCount:rows.filter(r=>r.hard).length};
}

function renderChart(){
  const R=compute(chart);
  let h='';
  h+='<header class="top bleed"><div class="bleed-inner"><div class="brand">'+LOGO+'<div class="title"><h1>'+esc(chart.name||'Untitled race')+' <span class="kind">Pace Chart</span></h1>'+

    wiz.rows.forEach((r,i)=>{const n=q('w-n'+i),d=q('w-d'+i),c=q('w-c'+i),up=q('w-up'+i),dn=q('w-dn'+i);if(n)r.name=n.value;if(d)r.distText=d.value;if(c)r.cutText=c.value;if(up)r.gainText=up.value;if(dn)r.lossText=dn.value});

  }

  if(wiz.step===3&&wiz.mode==='bags'){ wiz.wins.forEach((w,i)=>{const e=q('w-e'+i),l=q('w-l'+i);if(e)w.e=e.value;if(l)w.l=l.value}); return; }

// Elevation cells: blank is unknown (counted as 0); accepts 1,200 or +1200 or 1200 ft. Returns false if unreadable.
function parseElev(t){ t=String(t||'').replace(/[,+\s]|ft|feet|m\b|-/gi,''); if(!t) return null; const v=parseFloat(t); return isNaN(v)||v<0?false:v; }
function startMin(){const v=parseClock(wiz.startText);return (v==null||isNaN(v))?NaN:v}

function buildStations(syntaxOnly){
  // returns {stations} or {err}. syntaxOnly: check clock cutoffs' format without converting (start time not known yet)
  const rows=wiz.rows, out=[]; let prevD=-1, prevCut=0;
  const sm=startMin();
  for(let i=0;i<rows.length;i++){
    const r=rows[i], name=r.name.trim()||(i===0?'Start':i===rows.length-1?'Finish':'');
    if(!name) return {err:'Aid station '+i+' needs a name.'};
    let d = i===0?0:parseFloat(r.distText);
    if(isNaN(d)) return {err:name+' needs a distance.'};
    if(d<=prevD) return {err:name+' must be farther than the station before it.'};
    prevD=d;
    let cut=null;
    if(i>0 && i<rows.length-1 && r.cutText.trim()){
      if(wiz.cutoffFormat==='clock'){
        const c=parseClock(r.cutText); if(c==null||isNaN(c)) return {err:'The cutoff for '+name+' should look like 6:00 PM or 18:00.'};
        if(syntaxOnly){cut=1; out.push({name,dist:d,cutoff:cut}); continue}
        if(isNaN(sm)) return {err:'Add a valid start time in step 2 so time-of-day cutoffs can be converted.'};
        let e=((c-sm)%1440+1440)%1440; while(e<=prevCut) e+=1440; cut=e;
      } else {
        const c=parseDur(r.cutText); if(c==null||isNaN(c)) return {err:'The cutoff for '+name+' should be hours:minutes of race time, like 14:25.'};
        if(c<=prevCut) return {err:'The cutoff for '+name+' has to be later than the cutoff before it.'};
        cut=c;
      }
      prevCut=cut;
    }
    const st={name,dist:wiz.entryUnit==='km'?d/KM:d,cutoff:cut};
    if(wiz.adv&&wiz.mode!=='bags'&&i>0){
      for(const [f,t,lab] of [['gain',r.gainText,'climb'],['loss',r.lossText,'descent']]){
        const v=parseElev(t); if(v===false) return {err:'The '+lab+' for '+name+' should be a number, like 1200.'};
        if(v!=null) st[f]=wiz.entryUnit==='km'?v*FT_PER_M:v;
      }
    }
    out.push(st);
  }
  if(out.length<2) return {err:'Add at least a start and a finish.'};
  if(wiz.adv&&wiz.mode!=='bags'&&!out.some(s=>s.gain||s.loss)) return {err:'Add the climb and descent for your sections, or switch pacing back to Even pace.'};
  return {stations:out,lastCut:prevCut};
}

function validateStep(){
  readWizInputs();
  if(wiz.step===1){const b=buildStations(true); if(b.err) return b.err}
  if(wiz.step===2){
    if(!wiz.name.trim()) return 'Give the race a name.';
    const s=startMin(); if(isNaN(s)) return 'Enter a start time like 6:00 AM or 06:00.';
    if(wiz.mode==='bags'&&!wiz.startDate) return 'Add the race date. The drop bag planner needs it for the weather and daylight.';
    const b=buildStations(); if(b.err) return b.err;
  }
  if(wiz.step===3&&wiz.mode==='bags'){ const w=buildWins(); return w.err||''; }
  if(wiz.step===3){
    if(!wiz.plans.length) return 'Add at least one goal time.';
    const seenL=new Set(), seenT=new Map(), plans=[];
    for(let i=0;i<wiz.plans.length;i++){
      const lab=wiz.plans[i].label.trim();
      if(!lab) return 'Give goal '+(i+1)+' a column name.';
      if(seenL.has(lab.toLowerCase())) return 'Two goals are both named "'+lab+'". Give each one a different name.';
      seenL.add(lab.toLowerCase());
      const tm=parseDur(wiz.plans[i].timeText);
      if(tm==null||isNaN(tm)||tm<=0) return 'Enter the '+lab+' time as hours:minutes, like 28:00.';
      if(seenT.has(tm)) return lab+' and '+seenT.get(tm)+' have the same time ('+fmtDur(tm)+'). Change one of them or remove it.';
      seenT.set(tm,lab); plans.push({label:lab,time:tm});
    }
    const t=parseDur(wiz.totalText);
    if(t==null||isNaN(t)) return 'Enter the overall cutoff as hours:minutes, like 34:00.';
    for(const p of plans) if(p.time>=t) return 'The '+p.label+' time ('+fmtDur(p.time)+') has to be faster than the overall cutoff ('+fmtDur(t)+').';
    const b=buildStations(); if(b.err) return b.err;
    if(b.lastCut>=t) return 'The overall cutoff has to be later than the last aid station cutoff ('+fmtDur(b.lastCut)+').';
    const mt=wiz.marginText.trim();
    if(!/^\d+$/.test(mt)) return 'Enter the cutoff margin as whole minutes from 0 to 120.';
    const mi=marginIssue(+mt,b.stations,plans,t); if(mi) return mi.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  }
  return '';
}

function buildWins(){
  const sm=startMin(), out=[null]; let pe=0, pl=0;
  for(let i=1;i<wiz.rows.length;i++){
    const w=wiz.wins[i]||{e:'',l:''}, name=(wiz.rows[i].name.trim()||(i===wiz.rows.length-1?'Finish':'Aid station '+i)), last=i===wiz.rows.length-1;
    const et=w.e.trim(), lt=w.l.trim();
    if(!et&&!lt){ if(last) return {err:'Enter your earliest and latest finish times.'}; out.push(null); continue; }
    if(!et||!lt) return {err:'Enter both an earliest and a latest time for '+name+', or leave both blank.'};
    const ec=parseClock(et), lc=parseClock(lt);
    if(ec==null||isNaN(ec)||lc==null||isNaN(lc)) return {err:'Times for '+name+' should look like 2:30 PM or 14:30.'};
    const roll=(tod,prev)=>{let x=((tod-sm)%1440+1440)%1440; while(x<prev) x+=1440; return x;};
    const e=roll(ec,pe), l=roll(lc,Math.max(pl,e));
    out.push({early:e,late:l}); pe=e; pl=l;
  }
  return {wins:out};
}

  wiz.rows.forEach((r,i)=>{ const st=b.stations[i]; if(!st) return; const k=stKey(st); if(okLoc(bp.locs[k])) return;

function parsePaste(txt){
  const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const rows=[];
  lines.forEach(l=>{
    const p=l.includes('\t')?l.split('\t'):l.split(',');
    const cells=p.map(s=>s.trim());
    if(cells.length<2||isNaN(parseFloat(cells[1]))) return; // skip header lines
    rows.push({name:cells[0],distText:cells[1],cutText:cells[2]||'',gainText:cells[3]||'',lossText:cells[4]||''});
  });
  if(rows.length<2) return null;
  if(parseFloat(rows[0].distText)!==0) rows.unshift({name:'Start',distText:'0',cutText:''});
  const last=rows[rows.length-1]; rows[0].cutText='';
  if(last.cutText){ wiz.totalText = last.cutText; last.cutText=''; }
  return rows;
}

/* Drop bags only: the runner's own arrival windows stand in for the pace chart. */
function computeManual(c){
  const st=c.stations, last=st.length-1, D=st[last].dist;
  const anchors=[{d:0,e:0,l:0}];
  st.forEach((s,i)=>{ if(i>0&&c.windows&&c.windows[i]) anchors.push({d:s.dist,e:c.windows[i].early,l:c.windows[i].late}); });
  const at=(d,k)=>{ let j=0; while(j<anchors.length-2&&anchors[j+1].d<d) j++; const a=anchors[j],b=anchors[j+1]||a; return b.d===a.d?a[k]:a[k]+(b[k]-a[k])*(d-a.d)/(b.d-a.d); };
  const early=st.map(s=>at(s.dist,'e')), late=st.map(s=>at(s.dist,'l'));
  const rows=st.map((s,i)=>({name:s.name,dist:s.dist,seg:i?s.dist-st[i-1].dist:0,cut:late[i],hard:false,first:i===0,last:i===last}));
  const mk=(label,times)=>({label,target:times[last],times,misses:[],tight:null,pinned:new Set()});
  return {rows,D,T:late[last],plans:[mk('Earliest',early),mk('Latest',late)],margin:0,limit:Infinity,limitAt:null,hardCount:0,manual:true};
}

function dbBags(R){
  const last=R.rows.length-1, keys=new Set(bp.picks), list=[{key:'__start',kind:'start',i:0,name:'Start'}];
  R.rows.forEach((r,i)=>{ if(i>0&&i<last&&keys.has(stKey(chart.stations[i]))) list.push({key:stKey(chart.stations[i]),kind:'drop',i,name:r.name}); });
  list.push({key:'__finish',kind:'finish',i:last,name:'Finish'});
  const drops=list.filter(b=>b.kind==='drop');
  let half=null; drops.forEach(b=>{ if(!half||Math.abs(R.rows[b.i].dist-R.D/2)<Math.abs(R.rows[half.i].dist-R.D/2)) half=b; });
  if(half) half.half=true;
  drops.forEach((b,n)=>{b.n=n+1;b.of=drops.length});
  return list;
}
// Arrival window: fastest goal column to the cutoff (or the slowest goal where a station has no posted cutoff).
function dbWin(R,i){
  if(i===0) return {early:0,late:0,eLab:'',lLab:''};
  let e=Infinity,eL='',l=-Infinity,lL='';
  R.plans.forEach(p=>{const t=p.times[i]; if(t<e){e=t;eL=p.label} if(t>l){l=t;lL=p.label}});
  const r=R.rows[i]; if(r.hard){l=r.cut;lL=chart.labels.cut}
  return {early:e,late:l,eLab:eL,lLab:lL};
}

function fmtT(f){return tUnit()==='C'?Math.round((f-32)*5/9)+'°C':Math.round(f)+'°F'}
function clk(el){const c=clockParts(el);return dayLabel(c.day)+' '+c.text}
/* ---------- weather and daylight (Open-Meteo, no key; sends only locations and dates) ---------- */
// Race times are local to the race. Open-Meteo answers in local time (timezone=auto), so hours line up by "month-day T hour".
// Within 15 days of the race we use the forecast; further out, the same dates from the last three years, where the coldest and
// hottest year drive the warnings. On long courses each aid station can have its own location: for every 15 minutes of a
// stretch we estimate where the runner is and use the weather at the nearest aid station that has a location.
const SAMPLE_SUNRISE=420, SAMPLE_SUNSET=1140;   // used only when no weather could be loaded
let curLoc=null, wxBusy=false, geoHits=null, geoBusy=false, geoErr='', stGeo={};
const pad2=n=>String(n).padStart(2,'0');
function todOf(el){return ((chart.startTime+Math.round(el))%1440+1440)%1440}
function baseUTC(){const [y,m,d]=(chart.startDate||'2000-01-01').split('-').map(Number);return Date.UTC(y,m-1,d)}
function elDate(el){return new Date(baseUTC()+(chart.startTime+Math.round(el))*60000)}
function mdKey(dt){return pad2(dt.getUTCMonth()+1)+'-'+pad2(dt.getUTCDate())}
function hourKey(el){const dt=elDate(el);return mdKey(dt)+'T'+pad2(dt.getUTCHours())}
function isoDay(ms){const dt=new Date(ms);return dt.getUTCFullYear()+'-'+pad2(dt.getUTCMonth()+1)+'-'+pad2(dt.getUTCDate())}
const okLoc=l=>l&&isFinite(l.lat)&&isFinite(l.lon);
function hasWx(){ return !!(bp.wx&&bp.wx.locs&&bp.wx.locs.race&&!bp.wx.err); }
// Weather data for the spot nearest a distance along the course (aid stations with their own location, else the race location).
function locAtDist(d){
  if(!hasWx()) return null;
  let best=null, bd=Infinity;
  // Use the last location at or before this point that has weather (the drop bag you just left).
  // Before the first one, use the first one ahead.
  const ok=L=>L&&L.h&&Object.keys(L.h).length;
  let first=null;
  (chart.stations||[]).forEach(s=>{ const L=bp.wx.locs['s:'+stKey(s)]; if(!ok(L)) return; if(!first) first=L; if(s.dist<=d+1e-6){best=L;} });
  best=best||first;
  return best||bp.wx.locs.race;
}
// Short time zone name (EDT, CDT...) for a location on the race day. Sun times are in that spot's local time.
function tzAbbr(tz,el){ if(!tz) return ''; try{ const [y,m,d]=(chart.startDate||'2000-01-01').split('-').map(Number), dt=new Date(Date.UTC(y,m-1,d,17)+Math.round(el||0)*60000);
  return new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'short'}).formatToParts(dt).find(p=>p.type==='timeZoneName').value; }catch(e){ return ''; } }
function tzSfx(tz,el){ if(chart&&chart.tz==='hide') return ''; const a=tzAbbr(tz,el); return a?' '+a:''; }
// Race clock: the time zone of the start (or the first drop bag with a location).
function raceTz(el){ return hasWx()&&bp.wx.locs.race?tzSfx(bp.wx.locs.race.tz,el):''; }
function wxZones(){ if(!hasWx()) return []; return [...new Set(Object.values(bp.wx.locs).map(l=>tzAbbr(l.tz,0)).filter(Boolean))]; }
function sunOf(el){ const L=curLoc&&curLoc.sun&&curLoc.sun[mdKey(elDate(el))]; return L?{rise:L[0],set:L[1]}:{rise:SAMPLE_SUNRISE,set:SAMPLE_SUNSET}; }
function isDark(el){const t=todOf(el), s=sunOf(el);return t<s.rise||t>=s.set}
function wxAt(el){
  const h=curLoc&&curLoc.h&&curLoc.h[hourKey(el)];
  if(h) return {lo:h[0],hi:h[1],rain:h[3]};
  const hr=todOf(el)/60, T=51-13*Math.cos((hr-3)/24*2*Math.PI), t=todOf(el);   // sample day, only without real data
  return {lo:T,hi:T,rain:(t>=1320||t<240)?45:20};
}
function dbWx(from,to,d0,d1){
  const keep=curLoc;
  let lo=Infinity,hi=-Infinity,rain=0,darkMin=0,prev=null;const events=[],step=15;
  for(let el=from;el<=to+0.01;el+=step){
    if(d0!=null&&hasWx()) curLoc=locAtDist(d0+(d1-d0)*(to>from?(el-from)/(to-from):0));
    const w=wxAt(el);lo=Math.min(lo,w.lo);hi=Math.max(hi,w.hi);rain=Math.max(rain,w.rain);
    const d=isDark(el); if(d&&el<to) darkMin+=Math.min(step,to-el);
    if(prev!==null&&d!==prev){ const s=sunOf(el); events.push({type:d?'sunset':'sunrise',el,at:d?s.set:s.rise,tz:hasWx()&&curLoc?curLoc.tz:''}); } prev=d;
  }
  curLoc=keep;
  return {lo:Math.round(lo),hi:Math.round(hi),rain:Math.round(rain),darkMin,events};
}
function evText(ev){const c=clockParts(ev.el);return (ev.type==='sunset'?'Sunset ':'Sunrise ')+dayLabel(c.day)+' '+fmtClock12(ev.at)+tzSfx(ev.tz,ev.el)}

// What to fetch: the race location plus every aid station the runner gave a location.
// Locations are only asked for at the start and the drop bag stations.
function locKeys(){ if(!chart||!chart.stations||!chart.stations.length) return []; const p=new Set(bp.picks||[]); return chart.stations.filter((s,i)=>i===0||p.has(stKey(s))).map(stKey); }
function raceLoc(){ const f=locKeys().map(k=>(bp.locs||{})[k]).find(okLoc); return f||(okLoc(bp.loc)?bp.loc:null); }
function wxPlan(){
  const RL=raceLoc();
  if(!chart||!chart.startDate||!RL) return null;
  const R=compute(chart), span=Math.ceil((chart.startTime+R.T)/1440)+1;
  const locs=[{key:'race',lat:RL.lat,lon:RL.lon}];
  locKeys().forEach(k=>{ const l=(bp.locs||{})[k]; if(okLoc(l)) locs.push({key:'s:'+k,lat:l.lat,lon:l.lon}); });
  const start=baseUTC(), end=start+(span-1)*864e5, today=Date.parse(isoDay(Date.now()));
  const kind=(end-today)/864e5<=15&&(start-today)>-864e5*3?'forecast':'typical';
  return {locs,start,end,kind,sig:JSON.stringify([chart.startDate,chart.startTime,span,locs,kind])};
}
async function getJSON(url){const r=await fetch(url);const j=await r.json();if(!r.ok||j.error) throw new Error(j.reason||('HTTP '+r.status));return j;}
function hm(iso){const t=String(iso).split('T')[1]||'00:00';const [h,m]=t.split(':').map(Number);return h*60+m}
// One request covers up to 20 places; Open-Meteo answers a list when several are asked for.
async function fetchBatch(locs,base,extra){
  const out=[];
  for(let i=0;i<locs.length;i+=20){
    const g=locs.slice(i,i+20);
    const j=await getJSON(base+'?latitude='+g.map(l=>l.lat.toFixed(4)).join(',')+'&longitude='+g.map(l=>l.lon.toFixed(4)).join(',')+'&temperature_unit=fahrenheit&timezone=auto&daily=sunrise,sunset'+extra);
    (Array.isArray(j)?j:[j]).forEach(x=>out.push(x));
  }
  return out;
}
async function fetchAll(plan){
  const res={}; plan.locs.forEach(l=>res[l.key]={h:{},sun:{}});
  const sunFrom=(j,o)=>j.daily.time.forEach((t,i)=>{o.sun[t.slice(5)]=[hm(j.daily.sunrise[i]),hm(j.daily.sunset[i])];});
  if(plan.kind==='forecast'){
    const arr=await fetchBatch(plan.locs,'https://api.open-meteo.com/v1/forecast','&hourly=temperature_2m,precipitation_probability&start_date='+isoDay(plan.start)+'&end_date='+isoDay(plan.end));
    arr.forEach((j,n)=>{ const o=res[plan.locs[n].key];
      j.hourly.time.forEach((t,i)=>{const T=j.hourly.temperature_2m[i], p=j.hourly.precipitation_probability[i]; if(T!=null) o.h[t.slice(5,13)]=[T,T,T,p==null?0:p];});
      sunFrom(j,o); o.tz=j.timezone; });
  } else {
    const s0=new Date(plan.start), yr=s0.getUTCFullYear(), today=Date.now(), years=[];
    for(let y=yr-1;years.length<3&&y>yr-8;y--){ const s=Date.UTC(y,s0.getUTCMonth(),s0.getUTCDate()); if(s+(plan.end-plan.start)<today-6*864e5) years.push(s); }
    const per=plan.locs.map(()=>({}));
    for(const s of years){
      const arr=await fetchBatch(plan.locs,'https://archive-api.open-meteo.com/v1/archive','&hourly=temperature_2m,precipitation&start_date='+isoDay(s)+'&end_date='+isoDay(s+(plan.end-plan.start)));
      arr.forEach((j,n)=>{ const P=j.hourly.precipitation, T=j.hourly.temperature_2m;
        j.hourly.time.forEach((t,i)=>{ if(T[i]==null) return; const k=t.slice(5,13);
          // Rain "chance": did that year see measurable rain within 3 hours either side of this hour?
          let wet=false; for(let d=-3;d<=3;d++){const v=P[i+d]; if(v!=null&&v>=0.2){wet=true;break}}
          (per[n][k]=per[n][k]||[]).push([T[i],wet]); });
        const o=res[plan.locs[n].key]; o.tz=j.timezone; if(!Object.keys(o.sun).length) sunFrom(j,o); });
    }
    plan.locs.forEach((l,n)=>{ const o=res[l.key]; o.years=years.map(s=>new Date(s).getUTCFullYear());
      Object.entries(per[n]).forEach(([k,a])=>{const ts=a.map(x=>x[0]);o.h[k]=[Math.min(...ts),Math.max(...ts),ts.reduce((s,v)=>s+v,0)/ts.length,Math.round(100*a.filter(x=>x[1]).length/a.length)];}); });
  }
  return res;
}
async function loadWx(force){
  const plan=wxPlan(); if(!plan||wxBusy) return;
  const fresh=bp.wx&&bp.wx.sig===plan.sig&&!bp.wx.err&&(plan.kind==='typical'||Date.now()-bp.wx.at<3*36e5)&&bp.wx.locs&&Object.values(bp.wx.locs).every(l=>l.tz);   // older saves lack time zones
  if(fresh&&!force) return;
  wxBusy=true; render();
  try{ bp.wx={sig:plan.sig,kind:plan.kind,at:Date.now(),locs:await fetchAll(plan)}; }
  catch(e){ bp.wx=Object.assign({},bp.wx&&bp.wx.sig===plan.sig?bp.wx:{},{err:'We couldn\'t get the weather right now. Check your connection and try again.',at:Date.now(),sig:plan.sig}); }
  finally { wxBusy=false; bpSave(); render(); }
}
async function geocode(q){
  q=String(q||'').trim();
  const j=await getJSON('https://geocoding-api.open-meteo.com/v1/search?count=5&language=en&name='+encodeURIComponent(q.split(',')[0].trim()));
  let hits=(j.results||[]).map(r=>({name:[r.name,r.admin1,r.country].filter(Boolean).join(', '),lat:r.latitude,lon:r.longitude}));
  const extra=q.split(',').slice(1).join(',').trim().toLowerCase(); if(extra){const f=hits.filter(h=>h.name.toLowerCase().includes(extra)); if(f.length) hits=f;}
  return hits;
}
async function geoSearch(q){
  q=String(q||'').trim(); if(!q){geoErr='Type a town or city near the race.';render();return}
  geoBusy=true; geoErr=''; geoHits=null; render();
  try{ geoHits=await geocode(q); if(!geoHits.length) geoErr='No places found for "'+q+'". Try a nearby town, or enter GPS coordinates.'; }
  catch(e){ geoErr='We couldn\'t search for places right now. Check your connection, or enter GPS coordinates.'; }
  finally{ geoBusy=false; render(); }
}
function parseCoord(t,max){const v=parseFloat(String(t).trim());return isFinite(v)&&Math.abs(v)<=max?v:NaN}
// "36.54, -84.70" (or with a tab or space) -> {lat,lon}; anything else is treated as a place name.
function parseLatLon(t){const m=String(t||'').trim().match(/^(-?\d+(?:\.\d+)?)[\s,;]+(-?\d+(?:\.\d+)?)$/); if(!m) return null; const la=+m[1], lo=+m[2]; return Math.abs(la)<=90&&Math.abs(lo)<=180?{lat:la,lon:lo}:null;}
async function setStationLoc(k,text){
  text=String(text||'').trim(); bp.locs=bp.locs||{};
  if(!text){ delete bp.locs[k]; if(bp.locText) delete bp.locText[k]; stGeo[k]=null; bpSave(); render(); loadWx(); return; }
  const ll=parseLatLon(text);
  if(ll){ bp.locs[k]={name:ll.lat.toFixed(3)+', '+ll.lon.toFixed(3),lat:ll.lat,lon:ll.lon}; stGeo[k]=null; bpSave(); render(); loadWx(); return; }
  stGeo[k]={busy:true}; render();
  try{ const hits=await geocode(text);
    if(!hits.length) stGeo[k]={err:'No place found. Try a nearby town, or paste GPS coordinates.'};
    else { bp.locs[k]=hits[0]; stGeo[k]=hits.length>1?{alts:hits.slice(1)}:null; bpSave(); loadWx(); }
  }catch(e){ stGeo[k]={err:'Couldn\'t look that up right now. Paste GPS coordinates instead.'}; }
  render();
}
// Paste one aid station per line in race order: "lat, lon", or "name, lat, lon" (tabs work too). Blank lines are skipped.
function pasteStationLocs(text){
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean), out=[];
  lines.forEach(l=>{ const nums=(l.match(/-?\d+(?:\.\d+)?/g)||[]).map(Number); if(nums.length>=2){ const la=nums[nums.length-2], lo=nums[nums.length-1]; if(Math.abs(la)<=90&&Math.abs(lo)<=180&&String(la).includes('.')) out.push({lat:la,lon:lo}); } });
  if(!out.length) return 'Couldn\'t find coordinates in those lines. Each line needs a latitude and longitude, like 36.54, -84.70.';
  const st=chart.stations, off=out.length===st.length?0:out.length===st.length-1?1:out.length===st.length-2?1:-1;
  if(off<0) return 'Found '+out.length+' sets of coordinates, but this race has '+st.length+' stops including the start and finish. Paste one line per aid station, in order.';
  bp.locs=bp.locs||{};
  out.forEach((ll,n)=>{ const s=st[n+off]; if(s) bp.locs[stKey(s)]={name:ll.lat.toFixed(3)+', '+ll.lon.toFixed(3),lat:ll.lat,lon:ll.lon}; });
  bpSave(); loadWx(); return '';
}
let pasteErr='', pendBusy=false;
// Town names that came in with an imported aid station chart get looked up once the planner opens.
async function resolvePending(){
  if(pendBusy||!bp.locText) return; const ks=Object.keys(bp.locText).filter(k=>!okLoc((bp.locs||{})[k])); if(!ks.length) return;
  pendBusy=true; bp.locs=bp.locs||{};
  for(const k of ks){ try{ const hits=await geocode(bp.locText[k]);
      if(hits.length){ bp.locs[k]=hits[0]; if(hits.length>1) stGeo[k]={alts:hits.slice(1)}; delete bp.locText[k]; }
      else stGeo[k]={err:'No place found for "'+bp.locText[k]+'". Try a nearby town, or paste GPS coordinates.'};
    }catch(e){ break; } }
  pendBusy=false; bpSave(); render(); loadWx();
}

function wxBanner(){
  if(!raceLoc()) return '<div class="banner"><p><b>Add locations</b> on the Drop bags step to get the forecast and real sunrise and sunset times. Until then, conditions are a sample day.</p></div>';
  if(!chart.startDate) return '<div class="banner"><p><b>Add the race date</b> to get the weather.</p></div>';
  if(wxBusy) return '<div class="banner"><p><b>Getting the weather...</b></p></div>';
  if(bp.wx&&bp.wx.err) return '<div class="banner"><p><b>'+esc(bp.wx.err)+'</b> Conditions below are a sample day until it loads.</p><button type="button" class="btn sm" data-act="b-wx">Try again</button></div>';
  if(!hasWx()) return '<div class="banner"><p>Weather hasn\'t loaded yet.</p><button type="button" class="btn sm" data-act="b-wx">Get weather</button></div>';
  const n=Math.max(1,Object.keys(bp.wx.locs).length-1), where=n>1?'your '+n+' locations':esc(raceLoc().name);
  const at=new Date(bp.wx.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  const zs=wxZones(), zn=zs.length>1?' <b>Heads up: your locations are in more than one time zone ('+zs.join(' and ')+').</b> Sunrise and sunset are shown in each spot\'s local time; your arrival times are whatever clock your pace chart uses.':zs.length?' Sunrise and sunset are in '+zs[0]+'.':'';
  if(bp.wx.kind==='forecast') return '<div class="banner"><p><b>Forecast for '+where+'</b>, updated '+esc(at)+'. Forecasts change, so check again the day before you pack.'+zn+'</p><button type="button" class="btn sm" data-act="b-wx">Refresh</button></div>';
  const ys=(bp.wx.locs.race.years||[]);
  return '<div class="banner"><p><b>Typical weather for '+where+'</b> on your race dates'+(ys.length?' in '+ys.join(', '):'')+'. Warnings use the coldest and hottest of those years. The real forecast shows up within about two weeks of race day.'+zn+'</p></div>';
}

function stLocRow(s,i){
  const k=stKey(s), L=(bp.locs||{})[k], g=stGeo[k], last=i===chart.stations.length-1;
  const label=i===0?'Start':last?'Finish':s.name;
  return '<div class="coordrow"><b>'+esc(label)+(i===0||last?'':' <span class="muted num">'+dShow(s.dist).toFixed(1)+' '+uLabel()+'</span>')+'</b>'+
    '<input class="in" data-stloc="'+esc(k)+'" value="'+esc(okLoc(L)?L.name:((bp.locText||{})[k]||''))+'" placeholder="Town or GPS" autocomplete="off">'+
    '<button type="button" class="btn sm" data-act="b-stloc" data-k="'+esc(k)+'"'+(g&&g.busy?' disabled':'')+'>'+(g&&g.busy?'...':okLoc(L)?'Update':'Set')+'</button>'+
    (okLoc(L)&&!parseLatLon(L.name)?'<small class="muted num">'+L.lat.toFixed(3)+', '+L.lon.toFixed(3)+'</small>':'')+
    (g&&g.err?'<small class="errs">'+esc(g.err)+'</small>':'')+
    (g&&g.alts?'<small>Not it? '+g.alts.map((a,j)=>'<button type="button" class="linkbtn" data-act="b-stalt" data-k="'+esc(k)+'" data-j="'+j+'">'+esc(a.name)+'</button>').join(' · ')+'</small>':'')+
    '</div>';
}
function dbLocBox(){
  const picked=new Set(bp.picks||[]), st=chart.stations, last=st.length-1;
  let h='<div class="locbox"><h3>Where are your drop bags?</h3>'+
    '<p class="preview">Give the start and each drop bag station a nearby town or its GPS coordinates. Each stretch uses the weather and daylight from the last drop bag you left, so on long courses the forecast follows you as you go. If a spot has no weather, the one before it is used. Only locations and dates are sent to the weather service.</p>';
  const rows=st.map((s,i)=>i===0||picked.has(stKey(s))?stLocRow(s,i):'').join('');
  h+='<div class="coordrows">'+(picked.size?rows:'<p class="preview">Check your drop bag stations above, and they\'ll show up here.</p>')+'</div>';
  h+='<details class="paste"'+(pasteErr?' open':'')+'><summary>Have coordinates for the whole course? Paste them</summary><p class="preview">One aid station per line, in race order, with latitude and longitude, like <span class="num">Pickett, 36.55, -84.80</span>. You can paste straight from a spreadsheet. Only the start and your drop bag stations are used.</p>'+
     '<textarea id="db-pastelocs" class="in" placeholder="Start, 36.49, -84.70&#10;Pickett, 36.55, -84.80"></textarea>'+(pasteErr?'<p class="err" role="alert">'+esc(pasteErr)+'</p>':'')+
     '<div style="margin-top:8px"><button type="button" class="btn" data-act="b-pastelocs">Use these</button></div></details>';
  return h+'</div>';
}
function fmtHrs(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?(h+' hr'+(m?' '+m+' min':'')):m+' min'}

function dbCtx(R,bags,k){
  const b=bags[k], w=dbWin(R,b.i), ctx={b,w};
  curLoc=locAtDist(R.rows[b.i].dist);
  if(b.kind!=='finish'){
    const nx=bags[k+1], nw=dbWin(R,nx.i);
    Object.assign(ctx,{next:nx,nw,from:w.early,to:nw.late,nextName:nx.kind==='finish'?'the finish':nx.name,nextBag:nx.kind==='finish'?'the finish':nx.name+' drop bag'});
    // Time for this stretch in each column. The runner picks which one to plan around (default: the slowest).
    ctx.legs=R.plans.map(p=>({label:p.label,from:p.times[b.i],to:p.times[nx.i]}));
    if(!chart.manual) ctx.legs.push({label:chart.labels.cut,from:R.rows[b.i].cut,to:R.rows[nx.i].cut,cut:true});
    ctx.legs.forEach(l=>l.mins=l.to-l.from);
    ctx.slow=ctx.legs.reduce((a,c)=>c.mins>=a.mins?c:a);
    const pick=(bp.bags[b.key]||{}).col;
    ctx.sel=ctx.legs.find(l=>l.label===pick)||ctx.slow;
    ctx.from=ctx.sel.from; ctx.to=ctx.sel.to;
    ctx.mins=ctx.sel.mins; ctx.hours=ctx.mins/60; ctx.wx=dbWx(ctx.from,ctx.to,R.rows[b.i].dist,R.rows[nx.i].dist);
    ctx.miNext=R.rows[nx.i].dist-R.rows[b.i].dist;
    // If she could reach this bag after dark, the stretch before it already told her to carry a headlamp.
    ctx.hasLamp=k>0&&isDark(ctx.from);
    ctx.needLamp=ctx.wx.darkMin>0&&!ctx.hasLamp;
    ctx.gap=null;
    for(let j=b.i;j<nx.i;j++){const d=R.rows[j+1].dist-R.rows[j].dist; if(!ctx.gap||d>ctx.gap.mi) ctx.gap={mi:d,from:R.rows[j].first?'the start':R.rows[j].name,to:R.rows[j+1].last?'the finish':R.rows[j+1].name};}
    const na=R.rows[b.i+1]; ctx.aidName=na.last?'the finish':na.name; ctx.miAid=na.dist-R.rows[b.i].dist;
  }
  return ctx;
}
function dbSuggest(b,ctx){
  const out=[], add=(id,qty,why)=>{ if(!out.some(o=>o.id===id)) out.push({id,name:DB_BYID[id].name,qty:qty||'',why}); };
  if(b.kind==='finish'){ ['dryshoes','drysocks','change','hoodie'].forEach(id=>add(id,'','For after you finish')); return out; }
  const x=ctx.wx, h=ctx.hours, span=fmtHrs(ctx.mins)+' to '+ctx.nextBag+' at '+ctx.sel.label+' pace';
  ['musher','sanitizer','socks','wipes'].forEach(id=>add(id,'','Foot care kit, every bag'));
  add('salt','1 small bag','Every bag');
  add('tums','','Every bag');
  add('cal',(Math.ceil(200*h/50)*50).toLocaleString('en-US')+' cal','200 per hour, '+span);
  add('tylenol','','Optional, every bag');
  ['chafe','lipbalm'].forEach(id=>add(id,'','Every bag'));
  add('buff','','Every bag');
  const lo='Low of '+fmtT(x.lo)+' before '+ctx.nextName;
  if(x.lo<55) add('lightlayer','',lo);
  if(x.lo<40) ['beanie','gloves','extralayer','tights'].forEach(id=>add(id,'',lo));
  if(x.lo<35) add('jacket','',lo);
  if(ctx.gap&&ctx.gap.mi>8) add('bottle','','No aid for '+dShow(ctx.gap.mi).toFixed(1)+' '+uLabel()+' between '+ctx.gap.from+' and '+ctx.gap.to);
  if(x.rain<40&&!(hasWx()&&bp.wx.kind==='forecast')) add('rainjacket','','No forecast yet, so pack for rain just in case');
  if(x.hi>75) ['extrasalt','bottle'].forEach(id=>add(id,'','High of '+fmtT(x.hi)+' before '+ctx.nextBag));
  if(x.hi>80) ['sunscreen','hat','icebandana'].forEach(id=>add(id,'','High of '+fmtT(x.hi)));
  if(x.rain>=40) ['rainjacket','zipbag'].forEach(id=>add(id,'','Up to '+x.rain+'% chance of rain'));
  if(ctx.needLamp) ['headlamp','batteries','backuplight'].forEach(id=>add(id,'','About '+fmtHrs(x.darkMin)+' in the dark before '+ctx.nextBag));
  else if(x.darkMin>0) add('batteries','','Fresh batteries in case yours run low before '+ctx.nextBag);
  add('coffee',x.darkMin>=180?'x2':'x1',x.darkMin>=180?'Two for running through the night':'Caffeine, every bag');
  if(b.kind==='drop'){
    let night=false;
    for(let el=ctx.w.early;el<=ctx.w.late+0.01;el+=15){const t=todOf(el);const sr=sunOf(el).rise; if(isDark(el)||(t>=sr&&t<sr+120)){night=true;break}}
    if(night) ['toothbrush','mouthwash'].forEach(id=>add(id,'','You may arrive overnight or early morning'));
    if(b.half) ['shoes','shorts','shirt'].forEach(id=>add(id,'','Your drop bag closest to halfway'));
  }
  return out;
}

function dbStepList(bags){
  return [['pick','Drop bags']].concat(bags.map(b=>['b:'+b.key,b.kind==='start'?'Start':b.kind==='finish'?'Finish':b.name]),[['morning','Race morning'],['summary','Checklist']]);
}
function dbCurStep(bags){
  const st=bp.step||'pick', steps=dbStepList(bags);
  return steps.some(s=>s[0]===st)?st:'pick';
}

function renderBags(){
  const R=compute(chart), bags=dbBags(R), steps=dbStepList(bags), st=dbCurStep(bags), cur=steps.findIndex(s=>s[0]===st);
  let h='<header class="top bleed"><div class="bleed-inner"><div class="brand">'+LOGO+'<div class="title"><h1>'+esc(chart.name||'Untitled race')+' <span class="kind">Drop Bags</span></h1>'+
    '</div></div><div class="actions"><button class="btn" data-act="b-exit" type="button">Race home</button></div></div></header><div class="greyband bleed"></div>';
  h+=wxBanner();
  h+='<div class="controls dbunits"><div class="ctl"><span class="eyebrow">Distance</span>'+segBtns('unit',[['mi','Miles'],['km','Kilometers']],chart.unit)+'</div>'+
     '<div class="ctl"><span class="eyebrow">Temperature</span>'+segBtns('tempUnit',[['F','°F'],['C','°C']],tUnit())+'</div>'+
     '<div class="ctl"><span class="eyebrow">Time zone on times</span>'+segBtns('tz',[['show','Show'],['hide','Hide']],chart.tz==='hide'?'hide':'show')+'</div></div>';
  h+='<nav class="dbsteps" aria-label="Planner steps">'+steps.map(([k,l],j)=>'<button type="button" data-act="b-go" data-step="'+esc(k)+'" class="'+(j===cur?'on':j<cur?'done':'')+'"'+(j===cur?' aria-current="step"':'')+'>'+esc(l)+'</button>').join('')+'</nav>';
  if(dbErr) h+='<p class="err" role="alert">'+esc(dbErr)+'</p>';
  if(st==='summary') maybeDonate();
  if(st==='pick') h+=dbPick(R);
  else if(st==='morning') h+=dbMorning();
  else if(st==='summary') h+=dbSummary(R,bags);
  else { const k=bags.findIndex(b=>'b:'+b.key===st); h+=dbBagView(R,bags,k); }
  const prev=steps[cur-1], next=steps[cur+1];
  h+='<div class="wizfoot"><button type="button" class="btn" data-act="b-back"'+(prev?'':' disabled')+'>'+(prev?'Back: '+esc(prev[1]):'Back')+'</button>'+
     (next?'<button type="button" class="btn primary" data-act="b-next">Next: '+esc(next[1])+'</button>':'<button type="button" class="btn primary" data-act="b-exit">Race home</button>')+'</div>';
  return h;
}

function dbPick(R){
  const last=R.rows.length-1, picked=new Set(bp.picks);
  let h='<section class="dbpanel"><div><h2>Where will you have drop bags?</h2><p class="preview" style="margin-top:6px;max-width:70ch">Check every aid station where you\'ll have a drop bag. The times shown are your arrival window: your fastest goal to the cutoff.</p></div>';
  if(!chart.startDate) h+='<div class="field"><label for="db-date">Race date</label><input class="in" type="date" id="db-date"><span class="help">Needed for the weather forecast and sunrise and sunset times.</span></div>';
  h+='<div class="dbpicks">';
  R.rows.forEach((r,i)=>{ if(i===0||i===last) return;
    const k=stKey(chart.stations[i]), w=dbWin(R,i);
    h+='<label class="dbpick"><input type="checkbox" data-pick="'+esc(k)+'"'+(picked.has(k)?' checked':'')+'><span><span class="nm">'+esc(r.name)+'</span>'+
       '<small>'+esc(clk(w.early))+' to '+esc(clk(w.late))+'</small></span><span class="mi num">'+dShow(r.dist).toFixed(1)+' '+uLabel()+'</span></label>';
  });
  return h+'</div>'+dbLocBox()+'</section>';
}

function cond(label,val,note,cls){return '<div class="cond'+(cls?' '+cls:'')+'"><span class="eyebrow">'+label+'</span><span class="v num">'+val+'</span>'+(note?'<small>'+note+'</small>':'')+'</div>'}

  headlamp:'headlamp',backuplight:'flashlight',batteries:'battery',zipbag:'zipbag',cal:'flame',kttape:'kttape',femcare:'femcare',firstaid:'firstaid',blister:'blister',beanie:'beanie',armsleeves:'sleeves',windshell:'windshell',sunglasses:'sunglasses',powerbank:'powerbank',stomach:'stomach',bugspray:'bugspray',tp:'tp',poles:'poles',blanket:'blanket',slides:'slides',via:'packet',coffee:'packet',caffpills:'capsules',cable:'plug',coke:'vial',

function icoKey(id){if(ICON_OF[id]) return ICON_OF[id]; const c=(bp.custom||[]).find(q=>q.id===id); return c&&c.ico&&ICONS[c.ico]?c.ico:'tag';}
function icon(id){return icoSvg(icoKey(id))}
function icoSvg(k){return '<svg class="ico" viewBox="0 0 48 48" aria-hidden="true">'+(ICONS[k]||ICONS.tag)+'</svg>'}
let dbDraft={name:'',cat:'other',ico:'tag',open:false};

let dbNew=new Set();
function calNum(q){const n=parseInt(String(q||'').replace(/[^0-9]/g,''),10);return isNaN(n)?0:n}
function calQty(n){return Math.max(0,n).toLocaleString('en-US')+' cal'}   // ids just added, so they drop in with a little bounce
function tileName(it){return esc(it.name)}
function dbBagView(R,bags,k){
  const ctx=dbCtx(R,bags,k), b=ctx.b, w=ctx.w, r=R.rows[b.i], bag=bagOf(b.key);
  const title=b.kind==='start'?'What you start with':b.kind==='finish'?'Your finish bag':esc(b.name);
  const eb=b.kind==='start'?'Start line':b.kind==='finish'?'Finish line':'Drop bag '+b.n+' of '+b.of;
  const mile=b.kind==='start'?'0.0 '+uLabel():dShow(r.dist).toFixed(1)+' '+uLabel();
  let h='<section class="dbpanel"><div class="dbtitle"><span class="eyebrow">'+eb+'</span><h2>'+title+'</h2>'+
    '<span class="muted num">'+mile+(b.half?' · closest drop bag to halfway':'')+'</span></div>';
  // conditions
  h+='<div class="conds">';
  if(b.kind==='start'){
    h+=cond('You start',esc(clk(0)+raceTz(0)),isDark(0)?'In the dark':'In daylight',isDark(0)?'dark':'');
  } else {
    h+=cond('You arrive',esc(clk(w.early)+raceTz(w.early))+'<br>to '+esc(clk(w.late)+raceTz(w.late)),esc(w.eLab)+' to '+esc(w.lLab));
    const d1=isDark(w.early),d2=isDark(w.late);
    const lightTxt=d1&&d2?'Dark':!d1&&!d2?'Daylight':(d1?'Dark or daylight':'Daylight or dark');
    const lightNote=d1===d2?(d1?'Arriving after dark':'Arriving in daylight'):(!d1?'Sunset '+fmtClock12(sunOf(w.early).set)+(hasWx()&&curLoc?tzSfx(curLoc.tz,w.early):'')+', you may arrive after dark':'Sunrise '+fmtClock12(sunOf(w.late).rise)+(hasWx()&&curLoc?tzSfx(curLoc.tz,w.late):'')+', you may arrive in the dark');
    h+=cond('Light',lightTxt,lightNote,d1&&d2?'dark':'');
  }
  if(b.kind!=='finish'){
    const x=ctx.wx;
    h+='<div class="cond leg"><span class="eyebrow">To '+esc(ctx.nextBag)+'</span>'+

       '<div class="legbox"><span class="lh">Time to get to next drop bag based on:</span><div class="legs" role="group" aria-label="Plan this bag around">'+ctx.legs.map(l=>'<button type="button" class="leg'+(l===ctx.sel?' slow':'')+'" data-act="b-col" data-col="'+esc(l.label)+'" aria-pressed="'+(l===ctx.sel)+'"><span>'+esc(l.label)+(l===ctx.slow?' · slowest':'')+'</span><b class="num">'+fmtHrs(l.mins)+'</b></button>').join('')+'</div>'+
       '<small class="pk">Tap a time to plan this bag around it. The weather, darkness, and calories on this screen use <b>'+esc(ctx.sel.label)+'</b>.</small></div></div>';
    h+=cond('Temperature',fmtT(x.lo)+' to '+fmtT(x.hi),'Low and high before '+esc(ctx.nextName));
    h+=cond('Rain','Up to '+x.rain+'%','Highest chance before '+esc(ctx.nextName));
    h+=cond('Sun',x.events.length?esc(x.events.map(evText).join(', ')):(x.darkMin>0?'Dark':'Daylight'),x.events.length?'Before '+esc(ctx.nextName):'The whole way to '+esc(ctx.nextName),!x.events.length&&x.darkMin>0?'dark':'');
  }
  h+='</div>';

  const sugg=dbSuggest(b,ctx), have=new Set(bag.items.map(it=>it.id)), dis=new Set(bag.dismissed);

  const alerts=[], x=ctx.wx;

    const j=bag.items.indexOf(it);

      why:'That\'s 200 per hour for '+fmtHrs(ctx.mins)+' to '+ctx.nextBag+' at '+ctx.sel.label+' pace.'+(it&&got<rec?' That\'s less than the recommended '+calS.qty+'.':'')});
  }
  if(ctx.needLamp){
    const ss=x.events.find(e=>e.type==='sunset');

      why:(ss?'Sunset is at '+fmtClock12(ss.at)+tzSfx(ss.tz,ss.el)+', before you reach '+ctx.nextBag+'.':'You\'ll be running in the dark on the way to '+ctx.nextBag+'.')+' Plan on about '+fmtHrs(x.darkMin)+' in the dark, so bring headlamp batteries as well.'});

  const SAT={lightlayer:['lightlayer','extralayer','longsleeve','jacket','windshell','rainjacket'],extralayer:['extralayer','jacket'],beanie:['beanie'],gloves:['gloves'],rainjacket:['rainjacket']};
  const where=j=>bags[j].kind==='start'?'the start':'your '+bags[j].name+' drop bag';
  const earlier=id=>{const hits=[]; for(let j=0;j<k;j++){(bagOf(bags[j].key).items||[]).forEach(it=>{if(SAT[id].includes(it.id)) hits.push({name:it.name,at:where(j)})})} return hits;};
  const gear=(ids,ico,todo,done,checkT,cond,ask)=>{ const why=cond+' '+ask;
    const hits=[],need=[];
    ids.forEach(id=>{const hh=earlier(id); if(hh.length) hh.forEach(x=>{if(!hits.some(y=>y.name===x.name&&y.at===x.at)) hits.push(x)}); else need.push(id);});
    const byAt={}; hits.forEach(x=>(byAt[x.at]=byAt[x.at]||[]).push(x.name.toLowerCase()));
    const recap=hits.length?'You packed '+Object.entries(byAt).map(([at,ns])=>'your '+ns.join(' and your ')+' at '+at).join(', and ')+'.':'';
    if(!need.length) alerts.push({check:true,ico,todo:checkT,why:cond+' '+recap+' Do you still have '+(hits.length>1?'them':'it')+' with you? If not, pack '+(hits.length>1?'replacements':'another')+' here.'});
    else alerts.push({items:need,ico,todo,done,cond,why:why+(recap?' '+recap+' You still need '+need.map(id=>DB_BYID[id].name.toLowerCase()).join(', ')+' for this stretch.':'')});
  };
  if(x&&x.lo<40){
    gear(['beanie','gloves','extralayer'],'beanie','Pack warm gear.','Warm gear packed.','Warm gear check.',
      'It could drop to '+fmtT(x.lo)+' before '+ctx.nextBag+'.','Bring a warm hat, gloves, and an extra layer.');
  } else if(x&&x.lo<50){
    gear(['lightlayer'],'lightlayer','Pack a layer.','Layer packed.','Layer check.',
      'It could drop to '+fmtT(x.lo)+' before '+ctx.nextBag+'.','Bring a layer you can put on as it cools off.');
  }

  }

  }
  const MUST=new Set(); alerts.forEach(a=>(a.items||[]).forEach(id=>MUST.add(id)));
  const open=sugg.filter(s=>!have.has(s.id)&&!dis.has(s.id)).sort((a,b)=>MUST.has(b.id)-MUST.has(a.id)), nDis=sugg.filter(s=>dis.has(s.id)&&!have.has(s.id)).length;
  alerts.forEach(a=>{
    if(a.check){ h+='<div class="alert info" role="status"><span class="aico">'+icon(a.ico)+'</span><div><b>'+esc(a.todo)+'</b> '+esc(a.why)+'</div></div>'; return; }
    const missing=a.items.filter(id=>!have.has(id)), packed=!missing.length&&!a.short;
    const names=missing.map(id=>(DB_BYID[id]||{name:id}).name.toLowerCase());
    h+='<div class="alert'+(packed?' ok':'')+'" role="status"><span class="aico">'+icon(a.ico)+'</span><div><b>'+esc(packed||a.short?a.done:a.todo)+'</b> '+esc(packed&&a.cond?a.cond:a.why)+
       (!packed&&missing.length&&missing.length<a.items.length?' Still missing: '+esc(names.join(', '))+'.':'')+(a.btn?' '+a.btn:'')+'</div></div>';
  });
  if(!ctx.needLamp&&ctx.hasLamp&&x.darkMin>0){
    h+='<div class="alert info" role="status"><span class="aico">'+icon('headlamp')+'</span><div><b>Headlamp check.</b> '+'At '+esc(ctx.sel.label)+' pace you\'ll arrive after dark, so your headlamp should already be on.'+' There\'s up to '+esc(fmtHrs(x.darkMin))+' more of darkness before '+esc(ctx.nextBag)+'. '+
       'Will your batteries last that long? If not, pack spares in this bag. Consider packing a spare light if you don\'t already have one.</div></div>';
  }

  h+='<div class="fun">';
  // the bag
  const n=bag.items.length;
  h+='<div class="sackcol"><div class="sack'+(n?'':' empty')+(dbNew.size?' bump':'')+'" id="sack" data-key="'+esc(b.key)+'">'+
     '<span class="hnd" aria-hidden="true"><i></i></span><span class="cap l" aria-hidden="true"></span><span class="cap r" aria-hidden="true"></span><span class="pull" aria-hidden="true"></span>'+
     '<span class="sacktag"><b>'+esc(b.kind==='start'?'Start':b.kind==='finish'?'Finish':b.name)+'</b>'+esc(mile)+'</span>'+
     '<div class="sackhead"><span>'+(b.kind==='start'?'You carry':'In the bag')+'</span><span class="num">'+n+' item'+(n===1?'':'s')+'</span></div>'+
     '<div class="sackin">';
  if(!n) h+='<p class="sackhint">Drag items here<br><small>or tap an item to add it</small></p>';
  bag.items.forEach((it,j)=>{
    h+='<div class="btile'+(dbNew.has(it.id)?' new':'')+'"><span class="bico">'+icon(it.id)+'</span><span class="bnm">'+tileName(it)+'</span>'+
       (it.id==='cal'?'<button type="button" class="bqty cal" data-act="b-calfocus" aria-label="Change calories">'+esc(it.qty||'Set amount')+' ✎</button>':it.qty?'<span class="bqty">'+esc(it.qty)+'</span>':'')+
       '<button type="button" class="bx" data-act="b-rm" data-j="'+j+'" aria-label="Take '+esc(it.name)+' out">×</button></div>';
  });
  h+='</div></div></div>';

  // the shelf

  h+='<div class="shelfsec"><div class="shelfh"><h3>Suggested for this bag <span class="muted num">('+open.length+')</span></h3>'+(open.length?'<button type="button" class="btn sm primary" data-act="b-addall">Add all</button>':'')+'</div>';

     '<input class="in" id="db-cname" placeholder="e.g. Favorite snack" autocomplete="off" value="'+esc(dbDraft.name)+'">'+
     '<select class="in" id="db-ccat" aria-label="Category" style="flex:0 1 11rem">'+DB_CATS.map(([c,l])=>'<option value="'+c+'"'+(dbDraft.cat===c?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>'+

       '<button type="button" class="rm" data-act="b-rm" data-j="'+j+'" aria-label="Remove '+esc(it.name)+'">×</button></div>';
  });
  h+='</div></div></section>';
  return h;
}

    h+='<div class="itemrow two"><input class="in" id="db-m'+j+'" data-mi="'+j+'" autocomplete="off" value="'+esc(m.text)+'" aria-label="To-do '+(j+1)+'"><button type="button" class="rm" data-act="b-mrm" data-j="'+j+'" aria-label="Remove '+esc(m.text)+'">×</button></div>';

let donateOpen=false;
function donateBody(){
  return '<p>Consider making a donation to The Women\'s 100 Miler Project and help us provide more opportunities for women.</p>'+
    (DONATE.qr?'<img class="qr" src="'+esc(DONATE.qr)+'" alt="Venmo QR code for The Women\'s 100 Miler Project">':'<div class="qr ph">Venmo QR code goes here</div>')+
    (DONATE.venmo?'<a class="btn primary" href="https://venmo.com/u/'+encodeURIComponent(DONATE.venmo)+'" target="_blank" rel="noopener">Donate on Venmo</a><p class="muted">Venmo: <b>@'+esc(DONATE.venmo)+'</b></p>':'');
}
function renderDonate(){
  if(!donateOpen) return '';
  return '<div class="modalbg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="donh">'+
    '<button type="button" class="rm mx" data-act="r-donclose" aria-label="Close">×</button>'+
    '<h2 id="donh">Enjoying this app?</h2>'+donateBody()+
    '<button type="button" class="linkbtn" data-act="r-donclose">Maybe later</button></div></div>';
}
function maybeDonate(){ if(!store.donateSeen){ store.donateSeen=Date.now(); writeStore(); donateOpen=true; } }
function dbSummary(R,bags){
  let h='<section class="dbpanel"><div class="sumhead"><div><h2>Your packing checklist</h2><p class="preview" style="margin-top:6px;max-width:70ch">Everything you planned, bag by bag. Tick each item as you pack it; your ticks are saved. Or save a PDF to print and check off on paper.</p></div>'+
    '<button type="button" class="btn primary" data-act="b-pdf"'+(dbPdfBusy?' disabled':'')+'>'+(dbPdfBusy?'Building PDF...':'Save PDF')+'</button></div>'+
    (dbPdfMsg?'<p class="err" role="alert">'+esc(dbPdfMsg)+'</p>':'')+'<div class="sumgrid">';
  if(bp.morning.length) h+='<div class="box"><div class="boxh"><span>Race morning</span></div><div class="boxb"><ul class="ticks">'+bp.morning.map((m,j)=>'<li><label><input type="checkbox" data-ck="m" data-j="'+j+'"'+(m.done?' checked':'')+'><span>'+esc(m.text)+'</span></label></li>').join('')+'</ul></div></div>';
  bags.forEach(b=>{
    const bag=bagOf(b.key), w=dbWin(R,b.i), r=R.rows[b.i];
    const sub=b.kind==='start'?'Start, '+clk(0):b.kind==='finish'?'Finish':dShow(r.dist).toFixed(1)+' '+uLabel()+', '+clk(w.early)+' to '+clk(w.late);
    h+='<div class="box"><div class="boxh'+(b.kind==='drop'?' teal':'')+'"><span>'+esc(b.kind==='start'?'Start':b.kind==='finish'?'Finish bag':b.name)+'</span><span class="num" style="font-weight:500;font-size:.85rem">'+bag.items.length+'</span></div><div class="boxb"><small class="muted">'+esc(sub)+'</small>'+
      (bag.items.length?'<ul class="ticks">'+bag.items.map((it,j)=>'<li><label><input type="checkbox" data-ck="'+esc(b.key)+'" data-j="'+j+'"'+(it.done?' checked':'')+'><span>'+esc(it.name)+(it.qty?' <span class="muted">('+esc(it.qty)+')</span>':'')+'</span></label></li>').join('')+'</ul>':'<p class="preview">Nothing packed yet.</p>')+'</div></div>';
  });
  return h+'</div><p class="donlink"><button type="button" class="linkbtn" data-act="r-donate">Support The Women\'s 100 Miler Project</button></p></section>';
}

let dbPdfBusy=false, dbPdfMsg='';
function buildBagPdf(jsPDF){
  const R=compute(chart), bags=dbBags(R);
  const doc=new jsPDF({unit:'pt',format:'letter'}), W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), M=40;
  doc.setFillColor(15,72,90); doc.rect(0,0,W,84,'F');
  try{ doc.addImage(LOGO_SRC,'PNG',M,12,60,60); }catch(e){}
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.text("DROP BAG CHECKLIST",M+74,30);
  doc.setFontSize(20); doc.text(chart.name||'Drop bags',M+74,52);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text((chart.startDate?new Date(chart.startDate+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})+'  |  ':'')+'Start '+fmtClock12(chart.startTime),M+74,68);
  doc.setFillColor(196,211,213); doc.rect(0,84,W,8,'F');
  // Cards in three columns like the app's checklist. Each card goes into the shortest column; a new page starts when it won't fit.
  const top0=112, GAP=12, NC=3, CW=(W-2*M-GAP*(NC-1))/NC, PAD=8, LH=11.5, BOT=H-30;
  let cols=Array(NC).fill(top0);
  const box=(x,yy,done)=>{ doc.setDrawColor(17,17,17); doc.setLineWidth(1); doc.rect(x,yy-8,9,9);
    if(done){ doc.setDrawColor(15,72,90); doc.setLineWidth(1.6); doc.line(x+1.6,yy-3.2,x+3.8,yy-0.9); doc.line(x+3.8,yy-0.9,x+7.9,yy-6.2); } };
  // The PDF fonts can't draw emoji, so the poop emoji prints as words.
  const clean=t=>String(t).replace(/\u{1F4A9}/gu,'Bathroom stop').replace(/[^\x00-\xFF]/g,'').trim();
  const card=(title,sub,rows,teal)=>{
    doc.setFontSize(9.5); doc.setFont('helvetica','normal');
    const tw=CW-2*PAD-14, wrapped=rows.map(r=>doc.splitTextToSize(r.text,tw)), rh=wrapped.map(l=>l.length*LH+3);
    doc.setFontSize(8); const subL=sub?doc.splitTextToSize(sub,CW-2*PAD):[];
    const hh=22, subH=subL.length?subL.length*10+4:0;
    const hOf=(from,to,first)=>hh+PAD+(first?subH:0)+(rows.length?rh.slice(from,to).reduce((t,v)=>t+v,0):LH+2)+PAD;
    let i=0, first=true;
    while(first||i<rows.length){
      let c=cols.indexOf(Math.min(...cols)), room=BOT-cols[c];
      // How many of the remaining rows fit in this column?
      let n=i; while(n<rows.length&&hOf(i,n+1,first)<=room) n++;
      const all=n===rows.length;
      if(!all&&(n-i<3||(first&&cols.some(y=>BOT-y>=hOf(i,rows.length,true))))){
        // Not enough room here: use another column if the rest fits there, else start a new page.
        const fitC=cols.findIndex(y=>BOT-y>=hOf(i,rows.length,first));
        if(fitC>=0){ c=fitC; n=rows.length; }
        else { doc.addPage(); cols=Array(NC).fill(40); c=0; room=BOT-40; n=i; while(n<rows.length&&hOf(i,n+1,first)<=room) n++; if(n===i) n=i+1; }
      }
      const x=M+c*(CW+GAP), y=cols[c], h=hOf(i,n,first);
      if(teal) doc.setFillColor(15,72,90); else doc.setFillColor(0,0,0);
      doc.roundedRect(x,y,CW,hh,5,5,'F'); doc.rect(x,y+hh-6,CW,6,'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10);
      doc.text(doc.splitTextToSize(title+(first?'':' (continued)'),CW-2*PAD-20)[0],x+PAD,y+14.5);
      if(rows.length&&first){ doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text(String(rows.length),x+CW-PAD,y+14.5,{align:'right'}); }
      doc.setDrawColor(196,211,213); doc.setLineWidth(0.8); doc.roundedRect(x,y,CW,h,5,5,'S');
      let yy=y+hh+PAD+7;
      if(first&&subL.length){ doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(90,104,110); doc.text(subL,x+PAD,yy); yy+=subH; }
      if(!rows.length){ doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(110,124,130); doc.text('Nothing packed yet.',x+PAD,yy+1); }
      for(let j=i;j<n;j++){
        const r=rows[j], L=wrapped[j]; box(x+PAD,yy+1,r.done);
        doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
        if(r.done) doc.setTextColor(110,124,130); else doc.setTextColor(17,17,17);
        doc.text(L,x+PAD+14,yy);

        yy+=rh[j];
      }

    }
  };
  if(bp.morning.length) card('Race morning','',bp.morning.map(m=>({text:clean(m.text)||'To-do',done:m.done})),false);
  bags.forEach(b=>{
    const bag=bagOf(b.key), w=dbWin(R,b.i), r=R.rows[b.i];

  });

}
async function saveBagPdf(){

    let jsPDF;

    // Same rule as the pace chart PDF: inside Claude use its save prompt; on the website use a normal download.
