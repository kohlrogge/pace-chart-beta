/* drag and drop: mouse drags right away; on touch, press and hold briefly, then drag (a quick swipe still scrolls). Tap adds. */
let drag=null, dragEndedAt=0;
function overSack(x,y){const s=document.getElementById('sack');if(!s)return false;const r=s.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom}
function dragStart(){
  if(!drag||drag.on) return;
  drag.on=true;
  const r=drag.el.getBoundingClientRect(), g=drag.el.cloneNode(true);
  g.classList.add('dragghost'); g.removeAttribute('data-drag'); g.style.width=r.width+'px';
  drag.dx=drag.x-r.left; drag.dy=drag.y-r.top; drag.ghost=g; document.body.appendChild(g);
  drag.el.classList.add('lifting');
  dragMove(drag.x,drag.y);
  try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
}
function dragMove(x,y){
  if(!drag||!drag.on) return;
  drag.ghost.style.transform='translate('+(x-drag.dx)+'px,'+(y-drag.dy)+'px) rotate(-4deg) scale(1.06)';
  const s=document.getElementById('sack'); if(s) s.classList.toggle('over',overSack(x,y));
}
function dragEnd(x,y,cancel){
  if(!drag) return;
  clearTimeout(drag.timer);
  const d=drag; drag=null;
  if(!d.on) return;
  dragEndedAt=Date.now();
  d.ghost.remove(); d.el.classList.remove('lifting');
  const s=document.getElementById('sack'); if(s) s.classList.remove('over');
  if(!cancel&&overSack(x,y)) dbAct(d.el.dataset.act,d.el);
}
app.addEventListener('pointerdown',e=>{
  if(view!=='bags'||(e.pointerType==='mouse'&&e.button!==0)) return;
  const t=e.target.closest('[data-drag]'); if(!t) return;
  drag={el:t,x:e.clientX,y:e.clientY,pid:e.pointerId,touch:e.pointerType!=='mouse',on:false,timer:null};
  if(drag.touch) drag.timer=setTimeout(dragStart,220);
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6) return;
    if(drag.touch){clearTimeout(drag.timer);drag=null;return}   // a swipe: let the page scroll
    dragStart();
  }
  dragMove(e.clientX,e.clientY);
});
window.addEventListener('pointerup',e=>{ if(drag&&e.pointerId===drag.pid) dragEnd(e.clientX,e.clientY,false); });
window.addEventListener('pointercancel',e=>{ if(drag&&e.pointerId===drag.pid) dragEnd(0,0,true); });
document.addEventListener('touchmove',e=>{ if(drag&&drag.on) e.preventDefault(); },{passive:false});
document.addEventListener('contextmenu',e=>{ if(drag||(e.target.closest&&e.target.closest('[data-drag]'))) e.preventDefault(); });
document.addEventListener('dragstart',e=>{ if(e.target.closest&&e.target.closest('[data-drag]')) e.preventDefault(); });

/* ---------- import an aid station chart (Excel, CSV, or PDF), read in the browser; nothing is uploaded ---------- */
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let imp=null;   // {busy, err, file, rows:[[...]], head:int, map:{name,dist,cut,lat,lon,place}}
const IMP_FIELDS=[['name','Aid station name'],['dist','Distance'],['cut','Cutoff'],['gain','Climb'],['loss','Descent'],['lat','Latitude'],['lon','Longitude'],['place','Town or location']];
async function readSheet(file){
  if(!window.XLSX) await loadScript(XLSX_URL);
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
  // Use the sheet with the most filled rows.
  let best=[];
  wb.SheetNames.forEach(n=>{ const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).map(r=>r.map(c=>String(c).trim())).filter(r=>r.some(Boolean)); if(a.length>best.length) best=a; });
  return best;
}
async function readPdf(file){
  if(!window.pdfjsLib){ await loadScript(PDFJS_URL); window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER; }
  const pdf=await window.pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise, rows=[];
  for(let p=1;p<=Math.min(pdf.numPages,10);p++){
    const tc=await (await pdf.getPage(p)).getTextContent();
    // Group text pieces into lines by height on the page, then split each line into cells where there's a wide gap.
    const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>({x:it.transform[4],y:it.transform[5],w:it.width||0,s:it.str.trim(),h:Math.abs(it.transform[3])||8}));
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    const lines=[];
    items.forEach(it=>{ const L=lines.find(l=>Math.abs(l.y-it.y)<=it.h*0.5); if(L) L.items.push(it); else lines.push({y:it.y,items:[it]}); });
    lines.forEach(l=>{ l.items.sort((a,b)=>a.x-b.x); const cells=[]; let cur=null;
      l.items.forEach(it=>{ if(cur&&it.x-(cur.x+cur.w)<it.h*0.45){ cur.s+=(it.x-(cur.x+cur.w)>it.h*0.15?' ':'')+it.s; cur.w=it.x+it.w-cur.x; } else { cur={x:it.x,w:it.w,s:it.s}; cells.push(cur); } });
      rows.push(cells); });
  }
  // Line cells up under the header's columns by position, so a blank cell doesn't shift the rest of the row left.
  const hi=rows.findIndex(r=>r.some(c=>/mile|\bmi\b|\bkm\b|dist/i.test(c.s))&&r.length>=2);
  if(hi<0) return rows.map(r=>r.map(c=>c.s));
  const cols=rows[hi].map(c=>({l:c.x,r:c.x+c.w}));
  return rows.map((r,ri)=>{ if(ri<hi) return r.map(c=>c.s); const out=cols.map(()=>'');
    // A cell belongs to the column whose header starts at or just before it (tables are usually left-aligned);
    // if it ends before any header starts, use the nearest one.
    r.forEach(c=>{ let best=-1; cols.forEach((k,j)=>{ if(k.l<=c.x+c.w*0.5) best=j; });
      if(best<0){ let bd=Infinity; cols.forEach((k,j)=>{ const d=Math.abs(k.l-c.x); if(d<bd){bd=d;best=j;} }); }
      out[best]=out[best]?out[best]+' '+c.s:c.s; });
    return out; });
}
const isNum=v=>/^-?\d+(?:\.\d+)?$/.test(String(v).replace(/,/g,'').trim());
const isTimeish=v=>/^\d{1,3}:\d{2}(\s*[ap]\.?m\.?)?$/i.test(String(v).trim())||/^\d{1,2}\s*[ap]\.?m\.?$/i.test(String(v).trim());
function guessImport(rows){
  const kw={name:/aid|station|name|checkpoint|\bcp\b/i,dist:/mile|\bmi\b|\bkm\b|dist/i,cut:/cut.?off|close|closes|cut/i,lat:/\blat/i,lon:/\blon|\blng|long/i,place:/town|city|place|location|address|access/i,gain:/gain|climb|ascent|\bup\b|vert.*\+/i,loss:/loss|descent|descend|\bdown\b/i};
  // Header row: the first row in the top ten whose cells mostly aren't numbers and that names a distance column.
  let head=-1;
  for(let i=0;i<Math.min(rows.length,10);i++){ const r=rows[i]; if(r.some(c=>kw.dist.test(c))&&r.filter(c=>c&&!isNum(c)).length>=2){head=i;break;} }
  const map={name:-1,dist:-1,cut:-1,lat:-1,lon:-1,place:-1,gain:-1,loss:-1};
  if(head>=0){ const r=rows[head];
    ['gain','loss','lat','lon','dist','cut','name','place'].forEach(f=>{ const j=r.findIndex((c,j)=>kw[f].test(c)&&!Object.values(map).includes(j)); if(j>=0) map[f]=j; }); }
  const body=rows.slice(head+1), ncol=Math.max(...rows.map(r=>r.length));
  const col=j=>body.map(r=>r[j]||'').filter(Boolean), share=(j,f)=>{const v=col(j);return v.length?v.filter(f).length/v.length:0};
  const used=()=>Object.values(map);
  for(let j=0;j<ncol;j++){ if(used().includes(j)) continue;
    const nums=col(j).filter(isNum).map(v=>+v.replace(/,/g,''));
    if(map.lat<0&&share(j,isNum)>0.8&&nums.every(v=>Math.abs(v)<=90&&String(v).includes('.'))&&nums.some(v=>Math.abs(v)>1)){map.lat=j;continue}
    if(map.lat>=0&&map.lon<0&&j===map.lat+1&&share(j,isNum)>0.8&&nums.every(v=>Math.abs(v)<=180)){map.lon=j;continue}
    if(map.dist<0&&share(j,isNum)>0.8){map.dist=j;continue}
    if(map.cut<0&&share(j,isTimeish)>0.5){map.cut=j;continue}
    if(map.name<0&&share(j,v=>!isNum(v)&&!isTimeish(v))>0.6){map.name=j;continue}
  }
  return {head,map};
}
function importRows(){
  const {rows,head,map}=imp, g=(r,f)=>map[f]>=0?String(r[map[f]]||'').trim():'';
  const out=[];
  rows.slice(head+1).forEach(r=>{ const d=g(r,'dist').replace(/,/g,''); if(!isNum(d)) return;   // skip notes, totals, repeated headers
    const la=parseCoord(g(r,'lat'),90), lo=parseCoord(g(r,'lon'),180);
    out.push({name:g(r,'name'),distText:String(+d),cutText:g(r,'cut'),gainText:g(r,'gain'),lossText:g(r,'loss'),lat:isNaN(la)?null:la,lon:isNaN(lo)?null:lo,place:g(r,'place')}); });
  return out;
}
async function startImport(file){
  if(!file) return;
  readWizInputs(); imp={busy:true,file:file.name}; render();
  try{
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    let rows;
    if(ext==='pdf'||file.type==='application/pdf') rows=await readPdf(file);
    else if(['xlsx','xls','csv','ods','tsv','txt'].includes(ext)) rows=await readSheet(file);
    else throw new Error('type');
    if(!rows.length) throw new Error('empty');
    const g=guessImport(rows); imp={file:file.name,rows,head:g.head,map:g.map};
    if(!importRows().length) imp.err='We couldn\'t find aid station rows with distances in that file. Check the column choices below.';
  }catch(e){
    imp={file:file.name,err:e.message==='type'?'That file type isn\'t supported. Use an Excel, CSV, or PDF file.':e.message==='empty'?'We couldn\'t find any text in that file. If it\'s a scan or a photo, type the rows in or paste them instead.':'We couldn\'t read that file. Check your connection (the reader loads the first time you use it), or paste the rows instead.'};
  }
  render();
}
function applyImport(){
  const rows=importRows(); if(!rows.length){ imp.err='No rows with distances to fill in. Check the column choices.'; render(); return; }
  if(parseFloat(rows[0].distText)!==0) rows.unshift({name:'Start',distText:'0',cutText:''});
  rows[0].cutText='';
  const last=rows[rows.length-1]; if(last.cutText){ wiz.totalText=last.cutText; last.cutText=''; }
  if(rows.some(r=>/[ap]\.?m/i.test(r.cutText))) wiz.cutoffFormat='clock';
  if(rows.some(r=>r.gainText||r.lossText)&&wiz.mode!=='bags') wiz.adv=true;
  wiz.rows=rows; imp=null; wizErr=''; render();
}
function renderImport(){
  let h='<details class="paste"'+(imp?' open':'')+'><summary>Upload an aid station chart (Excel, CSV, or PDF)</summary>'+
    '<p class="preview">The file is read right here in your browser. You\'ll see what we found and can fix anything before it fills the table. PDFs work best when you can select the text in them; scans and photos can\'t be read.</p>'+
    '<input type="file" id="w-file" accept=".xlsx,.xls,.csv,.ods,.tsv,.txt,.pdf,application/pdf" class="in" style="max-width:420px">';
  if(imp&&imp.busy) h+='<p class="preview"><b>Reading '+esc(imp.file)+'...</b></p>';
  if(imp&&imp.err) h+='<p class="err" role="alert">'+esc(imp.err)+'</p>';
  if(imp&&imp.rows){
    const ncol=Math.max(...imp.rows.map(r=>r.length)), headRow=imp.head>=0?imp.rows[imp.head]:null;
    const colName=j=>'Column '+(j+1)+(headRow&&headRow[j]?': '+headRow[j]:'');
    h+='<div class="impmap"><b>Which column is which?</b><div class="impgrid">'+IMP_FIELDS.map(([f,l])=>'<label><span>'+l+'</span><select class="in" data-impf="'+f+'"><option value="-1">Not in this file</option>'+
      Array.from({length:ncol},(_,j)=>'<option value="'+j+'"'+(imp.map[f]===j?' selected':'')+'>'+esc(colName(j))+'</option>').join('')+'</select></label>').join('')+'</div>';
    const prev=importRows();
    h+='<p class="preview">'+prev.length+' aid station'+(prev.length===1?'':'s')+' found'+(prev.some(r=>r.lat!=null)?', with GPS coordinates':'')+(prev.some(r=>r.place)?', with locations':'')+(prev.some(r=>r.gainText||r.lossText)?', with climb and descent':'')+'. First few:</p>';
    if(prev.length) h+='<div class="stbox"><table class="sttable"><thead><tr><th></th><th>Name</th><th>Distance</th><th>Cutoff</th><th>Location</th></tr></thead><tbody>'+
      prev.slice(0,6).map((r,i)=>'<tr><td class="idx num">'+(i+1)+'</td><td>'+esc(r.name)+'</td><td class="num">'+esc(r.distText)+'</td><td class="num">'+esc(r.cutText)+'</td><td class="num">'+(r.lat!=null?r.lat+', '+r.lon:esc(r.place))+'</td></tr>').join('')+'</tbody></table></div>';
    h+='<div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" data-act="impapply"'+(prev.length?'':' disabled')+'>Fill the table with these</button><button type="button" class="btn" data-act="impcancel">Cancel</button></div>'+
      '<p class="preview">This replaces the rows above. You can fix anything in the table afterward.</p></div>';
  }
  return h+'</details>';
}

/* ---------- reorder aid stations by dragging the handle (or the arrow buttons) ---------- */
let rowDrag=null;
function moveRow(from,to){ readWizInputs(); const last=wiz.rows.length-1; to=Math.max(1,Math.min(last-1,to)); if(from===to||from<1||from>=last) return; const [r]=wiz.rows.splice(from,1); wiz.rows.splice(to,0,r); render(); const el=document.querySelector('[data-grip="'+to+'"]'); if(el) el.focus(); }
app.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('[data-grip]'); if(!g||view!=='wiz') return;
  e.preventDefault();
  const trs=[...document.querySelectorAll('.sttable.rowsort tbody tr')];
  rowDrag={from:+g.dataset.grip,y0:e.clientY,pid:e.pointerId,tr:trs[+g.dataset.grip],trs,mids:trs.map(t=>{const r=t.getBoundingClientRect();return r.top+r.height/2}),to:+g.dataset.grip};
  rowDrag.tr.classList.add('rowdragging');
});
window.addEventListener('pointermove',e=>{
  if(!rowDrag||e.pointerId!==rowDrag.pid) return;
  const dy=e.clientY-rowDrag.y0, last=rowDrag.trs.length-1; rowDrag.tr.style.transform='translateY('+dy+'px)';
  const y=rowDrag.mids[rowDrag.from]+dy; let to=rowDrag.from;
  for(let i=1;i<last;i++){ if(i<rowDrag.from&&y<rowDrag.mids[i]){to=i;break} if(i>rowDrag.from&&y>rowDrag.mids[i]) to=i; }
  rowDrag.to=to; rowDrag.trs.forEach((t,i)=>{t.classList.toggle('dropabove',i===to&&to<rowDrag.from);t.classList.toggle('dropbelow',i===to&&to>rowDrag.from)});
});
const endRowDrag=e=>{ if(!rowDrag||e.pointerId!==rowDrag.pid) return; const d=rowDrag; rowDrag=null; d.tr.style.transform=''; d.trs.forEach(t=>t.classList.remove('dropabove','dropbelow','rowdragging')); if(d.to!==d.from) moveRow(d.from,d.to); };
window.addEventListener('pointerup',endRowDrag); window.addEventListener('pointercancel',endRowDrag);

// Testing shortcut: opening the link with #demo fills setup with the example race. Not shown to users.
function isDemo(){try{return location.hash==='#demo'}catch(e){return false}}
view=store.ack?'home':'disclaimer';
const demo=()=>{store.ack=true;view='wiz';wiz=newDraft(EXAMPLE);wiz.mode='basic';wiz.isNew=true;wizErr='';};
if(isDemo()) demo();
try{window.addEventListener('hashchange',()=>{if(isDemo()){demo();render()}})}catch(e){}
render();

// expose for testing
window.__pace={get store(){return store},get imp(){return imp},compute,parseDur,parseClock,EXAMPLE,dbBags,dbCtx,dbSuggest,get bp(){return bp}};
})();
